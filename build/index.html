<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PMS · Pousada</title>
<!-- Instalação na tela de início (iPhone/Android). Sem service worker: nenhum dado fica em cache offline. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0d1221">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pousada">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#070b14;--bg1:#0d1221;--bg2:#131929;--bg3:#1b2234;
  --bd:#1e2d45;--bdh:#2d4268;
  --tx:#d9e4f5;--mu:#5a7090;--dm:#8898b4;
  --gr:#22c55e;--grd:#0f2b1a;
  --rd:#ef4444;--rdd:#2b0f0f;
  --bl:#3b82f6;--bld:#0f1e2b;
  --am:#f59e0b;--amd:#2b1e0a;
  --lp:#a855f7;--lpd:#1e0f2b;
  --bk:#0066cc;--ab:#ff5a5f;--di:#8b5cf6;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
}
body{background:var(--bg0);color:var(--tx);font-family:var(--font);font-size:14px;min-height:100vh;display:flex;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--bl);outline-offset:2px}

/* Layout */
#sidebar{width:96px;background:var(--bg1);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:stretch;padding:14px 8px;gap:2px;flex-shrink:0;overflow-y:auto}
#sidebar .logo{font-size:24px;margin-bottom:10px;text-align:center}
.nav-group{font-size:11px;font-weight:600;color:var(--mu);padding:12px 4px 4px;text-align:center;border-top:1px solid var(--bd);margin-top:6px}
.logo + .nav-group{border-top:none;margin-top:0;padding-top:2px}
.nav-btn{position:relative;width:100%;min-height:54px;border-radius:12px;border:none;background:transparent;color:var(--dm);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;transition:background .15s,color .15s}
.nav-btn .ico{font-size:20px;line-height:1}
.nav-btn .lbl{font-size:11px;font-weight:600;line-height:1.15;text-align:center}
.nav-btn:hover{background:var(--bg2);color:var(--tx)}
.nav-btn.active{background:#1e3a5f;color:#fff;box-shadow:inset 0 0 0 1px #3b82f666}
.nav-btn .dot{display:none;position:absolute;top:6px;right:14px;width:9px;height:9px;background:var(--rd);border-radius:50%;box-shadow:0 0 0 2px var(--bg1)}
.nav-btn.has-alert .dot{display:block}
.nav-more{display:none}
.more-group{font-size:12px;font-weight:600;color:var(--mu);margin:14px 0 8px}
.more-group:first-child{margin-top:0}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.more-item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);font-size:14px;font-weight:600;text-align:left;position:relative}
.more-item .ico{font-size:20px}
.more-item.active{border-color:var(--bl);background:#1e3a5f}
.more-item.has-alert::after{content:"";position:absolute;top:8px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--rd)}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:var(--bg1);border-bottom:1px solid var(--bd);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#topbar h1{font-family:'Fraunces',serif;font-size:21px;font-weight:700;color:var(--tx)}
#topbar .sub{font-size:12px;color:var(--mu);margin-top:2px}
#content{flex:1;overflow-y:auto;padding:24px}

/* Cards */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.kpi{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;text-align:left}
.kpi .val{font-size:30px;font-weight:700;font-family:'Fraunces',serif;line-height:1;font-variant-numeric:lining-nums;color:var(--tx)}
.kpi .lbl{font-size:12px;color:var(--dm);margin-top:6px;font-weight:600;display:flex;align-items:center;gap:6px}
.fin-kpi{font-size:22px;white-space:nowrap;font-variant-numeric:lining-nums}
.kpi .lbl .legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* Room grid */
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.room-card{--sc:var(--gr);background:var(--bg2);border:1px solid var(--bd);border-top:4px solid var(--sc);border-radius:14px;padding:12px 12px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative;user-select:none;transition:border-color .15s,background .15s}
.room-card:hover{background:var(--bg3);border-color:var(--bdh);border-top-color:var(--sc)}
.rc-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.room-num{font-family:'Fraunces',serif;font-size:26px;font-weight:700;line-height:1;color:var(--tx)}
.rc-chip{font-size:11px;font-weight:700;color:var(--sc);background:color-mix(in srgb,var(--sc) 16%,transparent);border-radius:99px;padding:3px 8px;white-space:nowrap}
.room-type{font-size:12px;color:var(--dm)}
.rc-guest{font-size:13px;font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-empty{color:var(--dm);font-weight:500}
.nw{white-space:nowrap}
.rc-undo{margin-top:auto;align-self:flex-start;background:none;border:none;padding:4px 0;color:var(--mu);font-size:11px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.rc-undo:hover{color:var(--tx)}
.group-note{font-size:13px;color:#f59e0b;background:#f59e0b14;border:1px solid #f59e0b55;border-radius:10px;padding:10px 12px;margin-bottom:14px;line-height:1.5}
.rc-out{font-size:11px;color:var(--mu);margin-top:-4px}
.clean-btn{margin-top:auto;font-size:12px;padding:7px 8px;border-radius:9px;border:1px solid color-mix(in srgb,var(--sc) 50%,transparent);background:color-mix(in srgb,var(--sc) 14%,transparent);color:var(--sc);cursor:pointer;font-family:inherit;font-weight:700;width:100%}
.clean-btn:hover{background:color-mix(in srgb,var(--sc) 24%,transparent)}

/* Legend */
.legend{display:flex;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dm);white-space:nowrap}
.legend-dot{width:8px;height:8px;border-radius:50%}

/* Reservas list */
.res-row{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:14px;margin-bottom:8px;transition:border-color .15s}
.res-row:hover{border-color:var(--bdh)}
.res-id{width:46px;height:46px;border-radius:10px;background:var(--bg0);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--bl);flex-shrink:0}
.pill{font-size:10px;padding:2px 9px;border-radius:99px;font-weight:700;letter-spacing:.04em}

/* Date group header */
.date-group-header{display:flex;align-items:center;gap:12px;margin:20px 0 10px;font-size:12px;font-weight:700;color:var(--dm)}
.date-group-header:first-child{margin-top:0}
.date-group-line{flex:1;height:1px;background:var(--bd)}
.date-group-badge{background:var(--bg2);border:1px solid var(--bd);border-radius:6px;padding:3px 10px;white-space:nowrap;font-size:10px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--bg1);border:1px solid var(--bd);border-radius:16px;padding:28px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.modal h2{font-family:'Fraunces',serif;font-size:17px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center}
.modal h2 button{background:none;border:none;color:var(--mu);font-size:24px;cursor:pointer;padding:0 4px}

/* Form */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--dm);margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;background:var(--bg0);border:1px solid var(--bd);border-radius:8px;color:var(--tx);padding:10px 12px;font-size:14px;outline:none;font-family:inherit}
.field textarea{height:64px;resize:vertical}
.row2{display:flex;gap:12px}
.row2 .field{flex:1}

/* Buttons */
.btn{border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;border:1px solid var(--bd);background:var(--bg3);color:#fff;font-family:inherit;cursor:pointer;transition:opacity .15s}
.btn-green{background:#166534;border-color:#166534}
.btn-blue{background:#1e3a5f;border-color:var(--bl);color:var(--bl)}
.btn-red{background:#4a1010;border-color:var(--rd)}
.btn-purple{background:#2d1545;border-color:var(--lp);color:var(--lp)}
.btn-dim{background:var(--bg3)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Filter bar */
.filter-bar{display:flex;gap:10px;margin-bottom:18px;align-items:center;flex-wrap:wrap}
.filter-bar input{background:var(--bg0);border:1px solid var(--bd);border-radius:8px;color:var(--tx);padding:8px 12px;font-size:13px;outline:none;width:220px;font-family:inherit}
.tab-btn{padding:8px 14px;border:1px solid var(--bd);border-radius:99px;background:var(--bg2);color:var(--dm);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit}
.tab-btn.active{background:#1e3a5f;border-color:var(--bl);color:var(--bl)}

/* Date filter */
.date-filter{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.date-filter label{font-size:12px;color:var(--dm);font-weight:600}
.date-filter input[type=date]{background:var(--bg0);border:1px solid var(--bd);border-radius:8px;color:var(--tx);padding:7px 10px;font-size:12px;outline:none;font-family:inherit}
.date-filter .clear-btn{font-size:11px;padding:7px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg2);color:var(--mu);cursor:pointer;font-family:inherit}

/* Sync */
.log-box{background:#04060d;border:1px solid var(--bd);border-radius:10px;padding:16px;font-family:inherit;font-size:11px;color:#4ade80;max-height:200px;overflow-y:auto;line-height:1.8;margin-top:16px}
.sync-info{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:20px;font-size:13px;color:var(--dm);line-height:1.7}

/* Today agenda */
.agenda{margin-top:28px;border-top:1px solid var(--bd);padding-top:22px}
.agenda-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.agenda-lbl{font-size:13px;font-weight:700;margin-bottom:8px}
.section-title{font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--tx);margin-bottom:12px}
.agenda-row{border-radius:8px;padding:9px 12px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:10px}
.agenda-room{font-weight:800;font-size:15px}

/* Suite */
.suite-wrapper{display:contents}
.suite-group{grid-column:span 2;display:flex;flex-direction:column;gap:4px;
  border:1.5px dashed #f59e0b66;border-radius:16px;padding:10px;position:relative;background:#2b1e0a33}
.suite-label{font-size:12px;color:#f59e0b;font-weight:700;text-align:left;margin:0 2px 4px}
.suite-rooms{display:flex;gap:10px}
.suite-rooms .room-card{flex:1}
.suite-join-btn{font-size:12px;padding:8px 10px;border-radius:7px;border:1px solid #f59e0b;
  background:#2b1e0a;color:#f59e0b;cursor:pointer;font-family:inherit;
  font-weight:700;text-align:center;margin-top:2px;transition:background .15s;width:100%}
.suite-join-btn:hover{background:#3d2a0f}

@media(max-width:640px){
  /* Layout: sidebar vira bottom nav */
  body{flex-direction:column}
  #sidebar{
    width:100%; height:58px; flex-direction:row;
    border-right:none; border-top:1px solid var(--bd);
    padding:0 6px; gap:2px; align-items:center;
    order:2; position:fixed; bottom:0; left:0; right:0; z-index:100;
    justify-content:space-around;
  }
  #sidebar .logo{display:none}
  #sidebar .nav-group, #sidebar .nav-extra, #user-nav-btn{display:none !important}
  .nav-btn{flex:1;min-height:0;height:52px;padding:4px 0;border-radius:10px;gap:2px}
  .nav-btn .ico{font-size:19px}
  .nav-btn .lbl{font-size:10px}
  .nav-btn .dot{right:calc(50% - 18px);top:4px}
  .nav-more{display:flex}
  .more-grid{grid-template-columns:1fr 1fr}
  #main{order:1; overflow:hidden; padding-bottom:calc(58px + env(safe-area-inset-bottom, 0px))}
  /* Aberto pela tela de início: respeita notch/Dynamic Island e barra do iPhone */
  #sidebar{height:calc(58px + env(safe-area-inset-bottom, 0px)); padding-bottom:env(safe-area-inset-bottom, 0px)}
  #topbar{padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top, 0px))}
  #topbar h1{font-size:15px}
  #topbar .sub{display:none}
  #topbar .btn{font-size:11px;padding:7px 12px}
  #content{padding:14px}

  /* KPIs: 3 por linha */
  .kpi-grid{grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
  .kpi{padding:9px 6px;text-align:center;border-radius:12px}
  .kpi .val{font-size:21px}
  .kpi .lbl{font-size:10px;flex-direction:column;gap:3px;line-height:1.15}
  .room-grid ~ .legend, .kpi-grid ~ .legend{display:none}

  /* Room grid: menor */
  .room-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .room-card{padding:8px 8px 9px;gap:4px;border-radius:12px}
  .rc-top{flex-direction:column;align-items:flex-start;gap:4px}
  .room-num{font-size:21px}
  .rc-chip{font-size:10px;padding:2px 7px}
  .room-type{font-size:10.5px}
  .rc-guest{font-size:12px}
  .rc-out{font-size:10px;margin-top:-2px}
  .clean-btn{font-size:11px;padding:6px 4px}
  .suite-group{padding:8px}
  .suite-rooms{gap:8px}

  /* Suite */
  .suite-group{grid-column:span 2}

  /* Agenda */
  .agenda-grid{grid-template-columns:1fr}
  .agenda{margin-top:18px;padding-top:14px}

  /* Reservas */
  .filter-bar{gap:7px}
  .filter-bar input{width:100%;order:-1}
  .filter-bar>div{overflow-x:auto;-webkit-overflow-scrolling:touch;
    display:flex;gap:6px;padding-bottom:2px;max-width:100%}
  .filter-bar>div::-webkit-scrollbar{display:none}
  .tab-btn{white-space:nowrap;font-size:10px;padding:7px 10px}
  .filter-bar .btn{white-space:nowrap}

  .date-filter{gap:6px}
  .date-filter>div:last-child{margin-left:0;width:100%;justify-content:flex-end}

  /* Res row compacto */
  .res-row{padding:10px 12px;gap:10px}
  .res-id{width:38px;height:38px;font-size:14px}

  /* Modal: full screen no mobile */
  .overlay{padding:0;align-items:flex-end}
  .modal{border-radius:16px 16px 0 0;max-height:88vh;padding:20px 16px}

  /* Legend scroll horizontal */
  .legend{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .legend::-webkit-scrollbar{display:none}
}

/* ─── Financeiro ─────────────────────────────────────────────────────────── */
@media(max-width:640px){
  .fin-lists{grid-template-columns:1fr !important}
  .fin-kpi{font-size:15px}
  .dup-new{display:none}
}
/* ─── Login ───────────────────────────────────────────────────────────────── */
#login-screen{position:fixed;inset:0;background:var(--bg0);display:flex;align-items:center;
  justify-content:center;z-index:9999}
#login-screen.hidden{display:none}
.login-box{background:var(--bg1);border:1px solid var(--bd);border-radius:20px;
  padding:40px 36px;width:100%;max-width:360px;text-align:center}
.login-box .logo{font-size:48px;margin-bottom:8px}
.login-box h2{font-size:20px;font-weight:700;margin-bottom:4px}
.login-box .sub{font-size:12px;color:var(--mu);margin-bottom:28px}
.login-box input{width:100%;background:var(--bg0);border:1px solid var(--bd);border-radius:10px;
  padding:12px 14px;color:var(--tx);font-size:14px;margin-bottom:12px;outline:none;box-sizing:border-box}
.login-box input:focus{border-color:var(--bl)}
.login-box .err{color:#ef4444;font-size:12px;margin-bottom:10px;min-height:18px}
.user-badge{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu);cursor:pointer}
.user-badge:hover{color:var(--tx)}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo">🏡</div>
    <h2>PMS Pousada</h2>
    <div class="sub">Faça login para continuar</div>
    <input type="text" id="l-user" placeholder="Usuário" autocomplete="username"
      onkeydown="if(event.key==='Enter')doLogin()">
    <input type="password" id="l-pass" placeholder="Senha" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()">
    <div class="err" id="l-err"></div>
    <button class="btn btn-green" style="width:100%;padding:13px;font-size:15px" onclick="doLogin()">
      Entrar
    </button>
  </div>
</div>

<div id="sidebar">
  <div class="logo">🏡</div>
  <div class="nav-group">Dia a dia</div>
  <button class="nav-btn active" onclick="showView('map')" title="Mapa de quartos" data-view="map"><span class="ico">🏨</span><span class="lbl">Mapa</span></button>
  <button class="nav-btn" onclick="showView('reservas')" title="Reservas" data-view="reservas"><span class="ico">📋</span><span class="lbl">Reservas</span></button>
  <button class="nav-btn" onclick="showView('calendario')" title="Calendário de ocupação" data-view="calendario"><span class="ico">🗓️</span><span class="lbl">Calendário</span></button>
  <button class="nav-btn" onclick="showView('hospedes')" title="Hóspedes" data-view="hospedes"><span class="ico">👥</span><span class="lbl">Hóspedes</span></button>
  <div class="nav-group admin-only">Dinheiro</div>
  <button class="nav-btn nav-extra admin-only" onclick="showView('financeiro')" title="Financeiro" data-view="financeiro" data-group="Dinheiro"><span class="ico">💰</span><span class="lbl">Financeiro</span></button>
  <button class="nav-btn nav-extra admin-only" onclick="showView('relatorios')" title="Relatórios" data-view="relatorios" data-group="Dinheiro"><span class="ico">📈</span><span class="lbl">Relatórios</span></button>
  <div class="nav-group admin-only">Canais</div>
  <button class="nav-btn nav-extra admin-only" onclick="showView('alertas')" title="Alertas de overbooking" data-view="alertas" data-group="Canais"><span class="ico">⚠️</span><span class="lbl">Alertas</span><span class="dot"></span></button>
  <button class="nav-btn nav-extra admin-only" onclick="showView('prereservas')" title="Pré-reservas e contatos" data-view="prereservas" data-group="Canais"><span class="ico">📝</span><span class="lbl">Pré-reservas</span></button>
  <button class="nav-btn nav-extra admin-only" onclick="showView('calendarios')" title="Links iCal para Booking e Airbnb" data-view="calendarios" data-group="Canais"><span class="ico">📅</span><span class="lbl">Links iCal</span></button>
  <button class="nav-btn nav-extra admin-only" onclick="showView('sync')" title="Sincronizar com Booking e Airbnb" data-view="sync" data-group="Canais"><span class="ico">🔄</span><span class="lbl">Sincronizar</span></button>
  <button class="nav-btn nav-more" onclick="openMoreMenu()" title="Mais opções" id="nav-more-btn"><span class="ico">☰</span><span class="lbl">Mais</span><span class="dot"></span></button>
  <div style="flex:1"></div>
  <button class="nav-btn" onclick="showUserMenu()" title="Minha conta" id="user-nav-btn"><span class="ico">👤</span><span class="lbl">Conta</span></button>
</div>

<div id="main">
  <div id="topbar">
    <div>
      <h1 id="view-title">Mapa de Quartos</h1>
      <div class="sub" id="today-label"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-green" onclick="openNewModal()">+ Nova Reserva</button>
    </div>
  </div>
  <div id="load-banner" role="alert" style="display:none;background:#2b0f0f;border-bottom:1px solid #ef444466;color:#fecaca;padding:10px 16px;font-size:12px;line-height:1.5"></div>
  <div id="content"></div>
</div>

<!-- Modal -->
<div class="overlay" id="modal" style="display:none" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h2 id="modal-title">Nova Reserva <button onclick="closeModal()">×</button></h2>

</div>

<script>
// ─── Sanitização XSS ──────────────────────────────────────────────────────────
// SEMPRE use esc() ao inserir dados do usuário em innerHTML
function esc(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/\x3c/g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}


const ROOMS = [
  {id:"10",type:"Triplo",climate:"AC",cap:3},
  {id:"11",type:"Triplo",climate:"Ventilador",cap:3},
  {id:"12",type:"Triplo",climate:"Ventilador",cap:3},
  {id:"20",type:"Quádruplo",climate:"AC",cap:4},
  {id:"21",type:"Triplo",climate:"AC",cap:3},
  {id:"22",type:"Casal+1 Soltr",climate:"AC",cap:3},
  {id:"23",type:"Casal+2 Soltr",climate:"AC",cap:4},

];

// ─── Suítes (quartos combinados) ─────────────────────────────────────────────
const SUITES = [
  { id:"11+12", label:"Suíte 11+12", rooms:["11","12"], type:"Triplo ×2 (Ventilador)", cap:6 }
];
const todayStr  = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const fmtDate   = s => s ? new Date(s+"T12:00:00").toLocaleDateString("pt-BR") : "—";
const fmtMonth  = s => s ? new Date(s+"T12:00:00").toLocaleDateString("pt-BR",{month:"long",year:"numeric"}) : "";
const genId     = () => Math.random().toString(36).slice(2,10);
const nights    = (ci,co) => Math.max(0,Math.round((new Date(co)-new Date(ci))/86400000));
const isSameDay = (a,b) => a===b;

// ─── State ────────────────────────────────────────────────────────────────────
let reservations = [];
let guests        = [];
let guestSearch   = "";
let transactions  = [];
// PMS-007: pagamentos ativos quando a tabela existe no banco (o servidor informa).
let paymentsEnabled = false;
let receivables     = [];
let finMonth      = todayStr().slice(0,7); // YYYY-MM
let currentView  = "map";
let syncLog      = [];
let icalUrls     = {booking:{},airbnb:{}};
let filterTab    = "upcoming";
let searchQ      = "";
let dateFrom     = "";
let dateTo       = "";
let groupByDate  = true;          // agrupamento por data nas reservas
let prereservations = [];


let cleanedRooms   = new Set();   // quartos limpos hoje (antes nunca era declarada)
let checkedInRooms = new Set();   // quartos com check-in confirmado hoje

async function saveRoomStates() {
  try {
    await api("POST", "/room-states", {
      cleaned:   [...cleanedRooms],
      checkedIn: [...checkedInRooms],
    });
  } catch(e) { console.error("saveRoomStates:", e); }
}

async function loadRoomStates() {
  try {
    const data = await api("GET", "/room-states");
    cleanedRooms   = new Set(data.cleaned   || []);
    checkedInRooms = new Set(data.checkedIn || []);
  } catch(e) { console.error("loadRoomStates:", e); }
}

// saveClean/saveCheckedIn agora salvam no servidor (sincroniza entre dispositivos)
function saveClean()     { saveRoomStates(); }
function saveCheckedIn() { saveRoomStates(); }

// Qual marcação de hoje pode ser desfeita neste quarto (PMS-013), ou null.
function undoableMark(roomId) {
  const t = todayStr();
  const active = r => r.roomId === roomId && r.status !== "cancelled";
  if (checkedInRooms.has(roomId) && reservations.some(r => active(r) && r.checkIn === t)) return "checkedIn";
  if (cleanedRooms.has(roomId) && reservations.some(r => active(r) && r.checkOut === t)) return "cleaned";
  return null;
}
const UNDO_LABEL = { checkedIn: "check-in", cleaned: "limpeza" };

// Desfaz uma marcação feita por engano. Pede confirmação; erro aparece na tela.
async function unmarkRoomState(roomId, kind, event) {
  if (event) event.stopPropagation();
  if (!confirm(`Desfazer a marcação de ${UNDO_LABEL[kind]} do quarto ${roomId}?`)) return;
  const res = await api("DELETE", `/room-states/${encodeURIComponent(roomId)}/${kind}`);
  if (res && Array.isArray(res.cleaned) && Array.isArray(res.checkedIn)) {
    cleanedRooms   = new Set(res.cleaned);
    checkedInRooms = new Set(res.checkedIn);
  } else {
    alert("Não foi possível desfazer a marcação do quarto " + roomId + ": " +
          (apiErrorMessage(res) || "verifique a conexão") + ".");
    await loadRoomStates();
  }
  render();
}

// Marca um quarto no servidor (uma marcação por vez, somada às dos outros aparelhos).
// Em caso de falha, avisa e recarrega o estado real, em vez de fingir que salvou.
async function markRoomState(roomId, kind) {
  const res = await api("POST", `/room-states/${encodeURIComponent(roomId)}/${kind}`);
  if (res && Array.isArray(res.cleaned) && Array.isArray(res.checkedIn)) {
    cleanedRooms   = new Set(res.cleaned);
    checkedInRooms = new Set(res.checkedIn);
  } else {
    alert("Não foi possível salvar a marcação do quarto " + roomId + ". Verifique a conexão e tente de novo.");
    await loadRoomStates();
  }
  render();
}

// ─── Auth state ──────────────────────────────────────────────────────────────
let authToken    = localStorage.getItem("pms_token") || "";
let authRole     = localStorage.getItem("pms_role")  || "";
let authUsername = localStorage.getItem("pms_user")  || "";

function setAuth(token, role, username) {
  authToken = token; authRole = role; authUsername = username;
  localStorage.setItem("pms_token",   token);
  localStorage.setItem("pms_role",    role);
  localStorage.setItem("pms_user",    username);
}
function clearAuth() {
  authToken = ""; authRole = ""; authUsername = "";
  localStorage.removeItem("pms_token");
  localStorage.removeItem("pms_role");
  localStorage.removeItem("pms_user");
}

// ─── API ──────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {method, headers:{"Content-Type":"application/json",
    ...(authToken ? {"Authorization":"Bearer "+authToken} : {})}};
  if (body) opts.body = JSON.stringify(body);
  let r;
  try {
    r = await fetch(path, opts);
  } catch(e) {
    console.error("api error:", e);
    return { _networkError: true, error: "Erro de conexão" };
  }
  // Sessão expirada: volta ao login e NÃO conta como sucesso (antes devolvia {},
  // que apiErrorMessage lia como "salvo").
  if (r.status === 401) { clearAuth(); showLoginScreen(); return { error: "Sua sessão expirou. Entre de novo; nada foi salvo." }; }
  // Resposta que não é JSON (ex.: página 502 do Render durante deploy). Antes o
  // erro escapava do try (return sem await) e o clique simplesmente não fazia nada.
  try { return await r.json(); }
  catch(e) {
    return { error: `O servidor respondeu de forma inesperada (HTTP ${r.status}). Nada foi salvo; tente de novo em instantes.` };
  }
}

// Gravação que confere a resposta (PMS-012). Em erro: avisa o motivo e devolve
// false, para quem chamou NÃO fechar o formulário nem fingir que salvou.
async function apiWrite(method, path, body, what) {
  const res = await api(method, path, body);
  const err = apiErrorMessage(res);
  if (err) { alert(`Não foi possível ${what}: ${err}`); return false; }
  return true;
}

async function doLogin() {
  const username = document.getElementById("l-user")?.value.trim();
  const password = document.getElementById("l-pass")?.value;
  const errEl = document.getElementById("l-err");
  errEl.textContent = "";
  try {
    const res = await fetch("/login", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || "Erro ao entrar"; return; }
    setAuth(data.token, data.role, data.username);
    hideLoginScreen();
    applyRole();
    await loadAll();
    startAutoRefresh();
    render();
  } catch(e) { errEl.textContent = "Erro de conexão"; }
}

function showLoginScreen() {
  document.getElementById("login-screen").classList.remove("hidden");
}
function hideLoginScreen() {

}

function applyRole() {

  document.querySelectorAll(".admin-only").forEach(el => {

  if (authRole !== "admin" && ["sync", "alertas", "prereservas", "calendarios", "financeiro", "relatorios"].includes(currentView)) {

const BLOCKED_NAMES = [
  /not available/i, /closed/i, /blocked/i,
  /bloqueado/i, /indispon/i, /unavailable/i,
];
// Só filtra bloqueios do Airbnb — no Booking "Closed" pode ser reserva real
const isAirbnbBlock = r => r.source === "airbnb" && BLOCKED_NAMES.some(p => p.test(r.guestName||""));

// Estado do último carregamento (PMS-012). Quando uma lista falha, a tela
// mantém o último dado válido e mostra um aviso — antes ela era trocada por []
// e parecia "sem reservas", induzindo a vender quarto ocupado.
let loadError    = null;   // texto do problema atual, ou null
let lastLoadedAt = null;   // Date do último carregamento completo de reservas
let reservationsLoaded = false;

async function loadAll() {
  const failed = [];
  try {
    const promises = [
      api("GET","/reservations"),
      api("GET","/guests"),
      api("GET","/room-states"),
      authRole === "admin" ? api("GET","/urls") : Promise.resolve(null),
      authRole === "admin" ? api("GET","/transactions?month="+finMonth) : Promise.resolve(null),
      authRole === "admin" ? api("GET","/prereservations") : Promise.resolve(null),
    ];
    const [res, gsts, states, urls, txns, preresvs] = await Promise.all(promises);
    if (Array.isArray(res)) {
      reservations = res.map(normalizeRes).filter(r => !isAirbnbBlock(r));
      reservationsLoaded = true;
      lastLoadedAt = new Date();
    } else failed.push("reservas");
    if (Array.isArray(gsts)) guests = gsts; else failed.push("hóspedes");
    if (states && Array.isArray(states.cleaned) && Array.isArray(states.checkedIn)) {
      cleanedRooms   = new Set(states.cleaned);
      checkedInRooms = new Set(states.checkedIn);
    } else if (!(states && !states.error && !states._networkError)) failed.push("limpeza/check-in");
    if (authRole === "admin") {
      if (urls && !urls.error && !urls._networkError) icalUrls = urls; else failed.push("calendários");
      if (Array.isArray(txns)) transactions = txns; else failed.push("financeiro");
      if (Array.isArray(preresvs)) prereservations = preresvs; else failed.push("pré-reservas");
    }
  } catch(e) { console.error(e); failed.push("conexão"); }
  if (authRole === "admin") {
    const ps = await api("GET", "/payments/status");
    if (ps && typeof ps.enabled === "boolean") paymentsEnabled = ps.enabled;
  }
  loadError = failed.length ? `Não foi possível atualizar: ${failed.join(", ")}.` : null;
  await refreshSyncStatus();
  render();
}

// Situação dos calendários Airbnb/Booking (PMS-011). Se estiverem atrasados ou
// com falha, a disponibilidade importada pode estar desatualizada: o aviso
// aparece no topo para todos. Enquanto houver problema, confere de novo em 1 min
// (ao acordar, o servidor sincroniza ~10 s depois de abrir).
let syncHealth = null;
let syncRecheckTimer = null;
async function refreshSyncStatus() {
  const st = await api("GET", "/sync/status");
  if (st && st.health && !st.error && !st._networkError) {
    syncHealth = { ...st.health, syncing: !!st.syncing };
  }
  if (syncRecheckTimer) { clearTimeout(syncRecheckTimer); syncRecheckTimer = null; }
  if (syncHealth && !syncHealth.ok) {
    syncRecheckTimer = setTimeout(async () => { syncRecheckTimer = null; await refreshSyncStatus(); render(); }, 60 * 1000);
  }
}

function feedLabel(key) {
  const [src, room] = String(key).split("/");
  const name = src === "airbnb" ? "Airbnb" : src === "booking" ? "Booking" : src;
  return `${name} ${room === "CF" ? "Casa Fechada" : room}`;
}

function fmtWhen(iso) {
  if (!iso) return "nunca";
  const d = new Date(iso);
  if (isNaN(d)) return "nunca";
  const sameDay = d.toDateString() === new Date().toDateString();
  const hm = d.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" });
  return sameDay ? `às ${hm}` : `em ${d.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit" })} ${hm}`;
}

// Fechamentos que a plataforma devolveu depois de ler o link da PMS (eco). Não
// é falha e não vai para o aviso do topo, mas fica visível em Sincronizar.
function echoNote(echoes) {
  if (!Array.isArray(echoes) || !echoes.length) return null;
  return "ℹ️ Datas que a plataforma devolveu fechadas depois de receber da PMS: " +
    echoes.map(e => `${feedLabel(e.feed).split(" ")[0]} ${e.room === "CF" ? "Casa Fechada" : e.room === "11+12" ? "suíte 11+12" : "quarto " + e.room}, ${fmtDate(e.checkIn)} → ${fmtDate(e.checkOut)}`).join("; ") +
    ". Já estão ocupadas na PMS, por isso não entram de novo. Se alguma for reserva de verdade no extranet, é overbooking: resolva na plataforma.";
}

// Texto do aviso de calendários, ou null se está tudo em dia.
function syncWarning() {
  const h = syncHealth;
  if (!h || h.ok) return null;
  if (h.neverRan) return "Os calendários do Airbnb/Booking ainda não foram sincronizados.";
  const parts = [];
  const conflicts = (h.failing || []).flatMap(f => (f.conflicts || []).map(c => ({ ...c, feed: f.feed })));
  if (conflicts.length)
    parts.push("⛔ Possível overbooking — reserva (ou mudança de datas) da plataforma NÃO foi aplicada no PMS porque há quarto ocupado: " +
      conflicts.map(c => `${feedLabel(c.feed).split(" ")[0]} ${c.room === "CF" ? "Casa Fechada" : c.room === "11+12" ? "suíte 11+12" : "quarto " + c.room}, ${fmtDate(c.checkIn)} → ${fmtDate(c.checkOut)}`).join("; ") +
      ". Confira na plataforma e resolva.");
  const otherFailing = (h.failing || []).filter(f => !(f.conflicts || []).length);
  if (otherFailing.length)
    parts.push("Calendário com falha: " + otherFailing.map(f => `${feedLabel(f.feed)} (${f.problem})`).join(", ") + ".");
  const stale = (h.stale || []).filter(s => !(h.failing || []).some(f => f.feed === s.feed));
  if (stale.length)
    parts.push("Sem atualizar: " + stale.map(s => `${feedLabel(s.feed)} (${fmtWhen(s.lastSuccessAt)})`).join(", ") + ".");
  if (!parts.length && h.runStale)
    parts.push(`Calendários do Airbnb/Booking sem atualizar desde ${fmtWhen(h.lastRunAt)}.`);
  if (h.syncing) parts.push("Atualizando agora…");
  return parts.join(" ");
}

// Aviso no topo quando os dados podem estar desatualizados ou incompletos.
function renderLoadBanner() {
  const el = document.getElementById("load-banner");
  if (!el) return;
  const sw = syncWarning();
  if (!loadError && !sw) { el.style.display = "none"; el.innerHTML = ""; return; }
  let html = "";
  if (loadError) {
    const when = lastLoadedAt
      ? `Dados de reservas da última atualização às ${lastLoadedAt.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}.`
      : "As reservas ainda não foram carregadas nesta sessão.";
    html += `⚠️ <b>${esc(loadError)}</b> ${esc(when)} Não confirme disponibilidade sem atualizar.
    <button class="btn" style="margin-left:8px;font-size:11px;padding:4px 10px" onclick="loadAll()">Tentar de novo</button>`;
  }
  if (sw) {
    html += `${html ? "<br>" : ""}📅 <b>${esc(sw)}</b> Reservas novas do Airbnb/Booking podem não aparecer: confira na plataforma antes de confirmar datas.`;
  }
  el.innerHTML = html;
  el.style.display = "block";
}

function normalizeRes(r) {
  return {
    id:          r.id,
    roomId:      r.room_id    || r.roomId,
    guestName:   r.guest_name || r.guestName,
    checkIn:     r.check_in   || r.checkIn,
    checkOut:    r.check_out  || r.checkOut,
    source:      r.source     || "direto",
    adults:      r.adults     || 2,
    children:    r.children   || 0,
    phone:       r.phone      || "",
    notes:       r.notes      || "",
    status:      r.status     || "confirmed",
    externalUid: r.external_uid || r.externalUid || null,
    groupId:     r.group_id || r.groupId || null,
    createdAt:   r.created_at   || r.createdAt   || new Date().toISOString(),
    amount:      r.amount   || 0,
    payment:     r.payment  || "pix",
  };
}

// Extrai a mensagem de erro de uma resposta da API (formato antigo {error:"..."}
// ou novo {error:{code,message}}). Retorna null quando a resposta é sucesso.
function apiErrorMessage(res) {
  if (!res || res._networkError) return "Erro de conexão. Nada foi salvo; tente novamente.";
  if (!res.error) return null;
  if (typeof res.error === "string") return res.error;
  if (res.error.code === "ROOM_CONFLICT")
    return `Quarto indisponível no período${res.error.rooms ? " (quarto " + res.error.rooms.join(", ") + ")" : ""}. Nada foi salvo.`;
  return res.error.message || "Erro ao salvar.";
}

// Salva (cria ou edita) UMA linha de reserva.
// Retorna { ok:true, reservation } ou { ok:false, error }. Não recarrega a tela:
// quem chama decide quando chamar loadAll() (evita recarregar 9x numa Casa Fechada).
async function saveReservation(form) {
  const isExisting = form.id && reservations.find(r=>r.id===form.id);
  if (isExisting) {
    const res = await api("PUT",`/reservations/${form.id}`, form);
    const err = apiErrorMessage(res);
    if (err) return { ok:false, error: err };
    // Ajuste de valor em reserva direta: só ATUALIZA o lançamento já vinculado.
    // Não cria lançamento novo na edição (antes isso duplicava receita — F2).
    // Modo antigo (sem pagamentos): ajusta o lançamento vinculado. Com pagamentos
    // ativos, mudar o valor contratado NÃO mexe na receita (regra 6).
    if (!paymentsEnabled && form.amount > 0 && form.source === "direto" && authRole === "admin") {
      const linked = await api("GET", "/transactions?reservation_id=" + encodeURIComponent(form.id));
      const existing = Array.isArray(linked)
        ? linked.find(t => t.reservation_id === form.id && t.type === "income")
        : null;
      if (existing) {
        if (Number(existing.amount) !== Number(form.amount)) {
          await api("PUT", "/transactions/"+existing.id, {
            ...existing,
            amount: form.amount,
            description: `Reserva Qto ${form.roomId} — ${form.guestName}`,
          });
        }
      } else if (Array.isArray(linked) &&
                 !/\[(Casa toda|Suíte grupo):/.test(form.notes || "")) {
        // Em CF/11+12 o lançamento fica só na primeira linha; não avisar nas demais.
        alert("Reserva salva. Não há lançamento financeiro vinculado a ela; " +
              "se algum valor já foi recebido, registre no Financeiro.");
      }
    }
    return { ok:true };
  }
  // Nova reserva: mantém o id gerado por quem chamou (antes era trocado aqui,
  // deixando o lançamento financeiro apontando para um id inexistente — F1).
  const res = await api("POST","/reservations", {...form, id: form.id || genId()});
  const err = apiErrorMessage(res);
  if (err || !res.reservation) return { ok:false, error: err || "Erro ao salvar a reserva." };
  reservations.push(normalizeRes(res.reservation));
  return { ok:true, reservation: res.reservation };
}

// Grava uma reserva composta (CF ou 11+12) numa única chamada ao servidor,
// que grava todas as linhas ou nenhuma (regra 5). Antes eram 9 chamadas
// seguidas: uma falha de rede no meio deixava a Casa Fechada pela metade.
async function saveReservationGroup(rows) {
  const ids = rows.map(r => r.id || genId());
  const res = await api("POST", "/reservations/group", {
    rows: rows.map((r, i) => ({ ...r, id: ids[i] })),
  });
  // Sem resposta, não dá para saber se o servidor gravou: avisar para conferir
  // antes de repetir (repetir criaria uma segunda Casa Fechada).
  if (res && res._networkError)
    return { ok:false, created: [], error: "Sem conexão com o servidor. Confira na tela se a reserva " +
      "aparece antes de tentar de novo — ela pode ter sido gravada." };
  const err = apiErrorMessage(res);
  if (err || !Array.isArray(res.reservations))
    return { ok:false, error: err || "Erro ao salvar a reserva. Nada foi salvo.", created: [] };
  res.reservations.forEach(r => reservations.push(normalizeRes(r)));
  return { ok:true, created: rows.map((r, i) => ({ id: ids[i], roomId: r.roomId })) };
}

// Ocupa o quarto? Cancelada e "pending" não (decisão de 23/11/2026; mesma
// regra do servidor e do banco).
const occupies = r => r.status !== "cancelled" && r.status !== "pending";

// Capacidade (decisão de 23/11/2026: só AVISAR, nunca barrar — cama extra,
// criança de colo etc.). CF = soma dos 9 quartos; 11+12 = soma dos dois.
function capacityOf(roomId) {
  if (roomId === "CF") return ROOMS.reduce((s, r) => s + r.cap, 0);
  const suite = SUITES.find(x => x.id === roomId);
  if (suite) return suite.cap;
  const room = ROOMS.find(x => x.id === roomId);
  return room ? room.cap : null;
}
// Pergunta antes de salvar acima da capacidade. Na edição, só se o número de
// hóspedes AUMENTOU (não insiste a cada salvamento de uma cama extra combinada).
function confirmCapacity(roomId, adults, children, previous) {
  const cap = capacityOf(roomId);
  const n = (Number(adults) || 0) + (Number(children) || 0);
  if (!cap || n <= cap) return true;
  if (previous && n <= (Number(previous.adults) || 0) + (Number(previous.children) || 0)) return true;
  const where = roomId === "CF" ? "a Casa Fechada" : roomId === "11+12" ? "a suíte 11+12" : `o quarto ${roomId}`;
  return confirm(`Atenção: ${n} hóspedes para ${where}, que comporta ${cap}. Salvar mesmo assim?`);
}

// Checagem de conflito no navegador para os quartos físicos informados.
// Serve só para avisar cedo; a garantia real fica no servidor/banco.
function localConflict(roomIds, checkIn, checkOut, ignoreId) {
  return reservations.find(r =>
    r.id !== ignoreId &&
    roomIds.includes(r.roomId) &&
    occupies(r) &&
    r.checkIn < checkOut &&
    r.checkOut > checkIn
  );
}

// PMS-006: rótulo do grupo da reserva (Casa Fechada / 11+12), ou null.
function groupLabelOf(r) {
  if (!r) return null;
  const tag = r.groupId || "";
  if (tag.startsWith("cf:") || /\[Casa toda:/.test(r.notes || "")) return "Casa Fechada (9 quartos)";
  if (tag.startsWith("suite:") || /\[Suíte grupo:/.test(r.notes || "")) return "suíte 11+12 (2 quartos)";
  return null;
}

async function cancelReservation(id) {
  const r = reservations.find(x => x.id === id);
  // Com a coluna de grupo, o servidor cancela o grupo inteiro de uma vez.
  const grp = r && r.groupId ? groupLabelOf(r) : null;
  const msg = grp ? `Cancelar a ${grp} inteira? Todos os quartos do grupo serão cancelados juntos. Esta ação não pode ser desfeita.`
                  : "Cancelar esta reserva? Esta ação não pode ser desfeita.";
  if (!confirm(msg)) return;
  const res = await api("PUT",`/reservations/${id}`, {status:"cancelled"});
  const err = apiErrorMessage(res);
  if (err) { alert("Não foi possível cancelar: " + err); await loadAll(); return; }
  await loadAll();
  closeModal();
}

// ─── Room helpers ─────────────────────────────────────────────────────────────
function getRoomStatus(roomId) {
  const t = todayStr();
  const hasCheckoutToday = reservations.some(r=>
    r.roomId===roomId && r.status!=="cancelled" && r.checkOut===t
  );
  const hasCheckinToday = reservations.some(r=>
    r.roomId===roomId && r.status!=="cancelled" && r.checkIn===t
  );

  // Se tem checkout hoje e ainda não limpou → roxo (limpeza obrigatória antes do próximo check-in)
  if (hasCheckoutToday && !cleanedRooms.has(roomId)) return "cleaning";

  // Quarto limpo (ou sem checkout hoje) — verifica check-in
  if (hasCheckinToday) {
    if (checkedInRooms.has(roomId)) return "occupied"; // check-in confirmado → vermelho
    return "checkin";                                   // check-in pendente → azul
  }

  // Ocupado (hóspede já dentro, sem movimento hoje)
  const isOccupied = reservations.some(r=>
    r.roomId===roomId && r.status!=="cancelled" && r.checkIn<t && r.checkOut>t
  );
  if (isOccupied) return "occupied";

  return "free";
}

function getRoomRes(roomId) {
  const t = todayStr();
  return reservations.find(r=>
    r.roomId===roomId && r.status!=="cancelled" && r.checkIn<=t && r.checkOut>t
  );
}

function markCheckedIn(roomId, event) {
  if (event) event.stopPropagation();
  checkedInRooms.add(roomId);
  render();
  return markRoomState(roomId, "checkedIn");
}

function markClean(roomId, event) {
  if (event) event.stopPropagation();
  cleanedRooms.add(roomId);
  render();
  return markRoomState(roomId, "cleaned");
}

// ─── CALENDÁRIO DE OCUPAÇÃO (PMS-019) ─────────────────────────────────────────
// Uma linha por quarto físico, uma coluna por NOITE. A reserva ocupa as noites
// [check_in, check_out): saída e entrada no mesmo dia não se sobrepõem.
// CF aparece como UMA barra nas 9 linhas e 11+12 como UMA barra nas 2 linhas,
// desde que o grupo esteja completo e com as mesmas datas; senão, barras soltas
// (mostra a verdade do banco em vez de esconder grupo quebrado).
let calStart = null;      // primeira noite exibida (YYYY-MM-DD)
let calDays  = 14;
const CAL_BLOCK_RE = /(not available|blocked|bloqueado|indispon|unavailable)/i;

function calAddDays(s, n) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}
function calDiff(a, b) {
  return Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 86400000);
}

function calendarLayout(list, start, days) {
  const end = calAddDays(start, days);
  const rowOf = Object.fromEntries(ROOMS.map((r, i) => [r.id, i]));
  const visible = (list || []).filter(r => r && r.status !== "cancelled" && rowOf[r.roomId] !== undefined &&
    r.checkIn && r.checkOut && r.checkIn < r.checkOut && r.checkIn < end && r.checkOut > start);

  const tagOf = r => {
    const n = r.notes || "";
    const cf = n.match(/\[Casa toda:[^\]]+\]/);
    if (cf) return cf[0];
    const s = n.match(/\[Suíte grupo:[^\]]+\]/);
    return s ? s[0] : null;
  };
  const makeBar = (lead, ids, row, rowSpan, kind) => {
    const col = Math.max(0, calDiff(start, lead.checkIn));
    const endCol = Math.min(days, calDiff(start, lead.checkOut));
    return {
      id: lead.id, ids, row, rowSpan, kind, col, span: endCol - col,
      clipLeft: lead.checkIn < start, clipRight: lead.checkOut > end,
      pending: lead.status === "pending",
      block: lead.source === "airbnb" && CAL_BLOCK_RE.test(lead.guestName || ""),
      source: lead.source || "", guestName: lead.guestName || "",
      roomId: lead.roomId, checkIn: lead.checkIn, checkOut: lead.checkOut,
      conflict: false, lane: 0, lanes: 1,
    };
  };

  const groups = new Map();
  for (const r of visible) {
    const t = tagOf(r);
    if (!t) continue;
    if (!groups.has(t)) groups.set(t, []);
    groups.get(t).push(r);
  }
  const bars = [];
  const grouped = new Set();
  for (const [tag, rows] of groups) {
    const rooms = rows.map(r => r.roomId).sort();
    const first = rows[0];
    const same = rows.every(r => r.checkIn === first.checkIn && r.checkOut === first.checkOut &&
      (r.status || "confirmed") === (first.status || "confirmed"));
    const isCF = tag.startsWith("[Casa toda") && rooms.length === ROOMS.length && new Set(rooms).size === ROOMS.length;
    const isSuite = tag.startsWith("[Suíte") && rooms.length === 2 && rooms[0] === "11" && rooms[1] === "12";
    if (!same || !(isCF || isSuite)) continue;
    const lead = rows.slice().sort((a, b) => (Number(b.amount) || 0) - (Number(a.amount) || 0) || rowOf[a.roomId] - rowOf[b.roomId])[0];
    bars.push(makeBar(lead, rows.map(r => r.id), isCF ? 0 : rowOf["11"], isCF ? ROOMS.length : 2, isCF ? "cf" : "suite"));
    rows.forEach(r => grouped.add(r.id));
  }
  for (const r of visible) if (!grouped.has(r.id)) bars.push(makeBar(r, [r.id], rowOf[r.roomId], 1, "room"));

  // Conflitos: noite em que 2+ reservas que BLOQUEIAM (não pending) ocupam o mesmo quarto.
  const count = {};
  for (const b of bars) {
    if (b.pending) continue;
    for (let row = b.row; row < b.row + b.rowSpan; row++)
      for (let c = b.col; c < b.col + b.span; c++) count[row + ":" + c] = (count[row + ":" + c] || 0) + 1;
  }
  const conflicts = Object.entries(count).filter(([, n]) => n > 1)
    .map(([k]) => { const [row, col] = k.split(":").map(Number); return { row, col, roomId: ROOMS[row].id, date: calAddDays(start, col) }; });
  const conflictSet = new Set(conflicts.map(c => c.row + ":" + c.col));
  for (const b of bars) {
    if (b.pending) continue;
    outer: for (let row = b.row; row < b.row + b.rowSpan; row++)
      for (let c = b.col; c < b.col + b.span; c++) if (conflictSet.has(row + ":" + c)) { b.conflict = true; break outer; }
  }

  // Faixas: barras que se cruzam no mesmo quarto ficam uma em cima da outra, nunca escondidas.
  const touches = (a, b) => a.row < b.row + b.rowSpan && b.row < a.row + a.rowSpan &&
    a.col < b.col + b.span && b.col < a.col + a.span;
  const order = bars.slice().sort((a, b) => a.col - b.col || b.rowSpan - a.rowSpan || String(a.id).localeCompare(String(b.id)));
  const placed = [];
  for (const b of order) {
    const taken = new Set(placed.filter(p => touches(p, b)).map(p => p.lane));
    while (taken.has(b.lane)) b.lane++;
    placed.push(b);
  }
  for (const b of bars) b.lanes = 1 + Math.max(b.lane, ...bars.filter(o => o !== b && touches(o, b)).map(o => o.lane));

  return { start, days, end, bars, conflicts };
}

function calNav(delta) {
  if (delta === 0) calStart = calAddDays(todayStr(), -1);
  else calStart = calAddDays(calStart || calAddDays(todayStr(), -1), delta);
  render();
}
function calSetDays(n) { calDays = n === 31 ? 31 : 14; render(); }

function renderCalendario() {
  if (!calStart) calStart = calAddDays(todayStr(), -1);
  const L = calendarLayout(reservations, calStart, calDays);
  const COL = 38, LBL = 44, ROW = 38, HEAD = 34;
  const today = todayStr();
  const width = LBL + COL * calDays;
  const WEEK = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];

  const controls = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
    <button class="btn" onclick="calNav(-7)" title="7 dias antes">◀ 7 dias</button>
    <button class="btn" onclick="calNav(0)">Hoje</button>
    <button class="btn" onclick="calNav(7)" title="7 dias depois">7 dias ▶</button>
    <select onchange="calSetDays(Number(this.value))" style="font-size:12px">
      <option value="14"${calDays === 14 ? " selected" : ""}>14 noites</option>
      <option value="31"${calDays === 31 ? " selected" : ""}>31 noites</option>
    </select>
    <span style="font-size:12px;color:var(--dm)">${esc(fmtDate(L.start))} → ${esc(fmtDate(L.end))} (saída)</span>
  </div>`;

  const conflictMsg = L.conflicts.length
    ? `<div style="font-size:12px;color:#ef4444;background:#ef444414;border:1px solid #ef444455;border-radius:8px;padding:8px 10px;margin-bottom:10px">
        ⚠️ ${L.conflicts.length} noite(s) com conflito neste período (quarto ${[...new Set(L.conflicts.map(c => c.roomId))].map(esc).join(", ")}). Veja em ⚠️ Alertas.</div>`
    : "";

  let head = `<div style="position:sticky;left:0;z-index:3;width:${LBL}px;height:${HEAD}px;background:var(--bg1)"></div>`;
  for (let c = 0; c < calDays; c++) {
    const d = calAddDays(L.start, c);
    const wd = new Date(d + "T12:00:00Z").getUTCDay();
    const isToday = d === today;
    head += `<div style="position:absolute;left:${LBL + c * COL}px;top:0;width:${COL}px;height:${HEAD}px;text-align:center;font-size:10px;line-height:1.3;
      color:${isToday ? "var(--bl)" : wd === 0 || wd === 6 ? "var(--dm)" : "var(--mu)"};font-weight:${isToday ? 800 : 500};padding-top:3px">
      ${WEEK[wd]}<br><b style="font-size:12px;color:${isToday ? "var(--bl)" : "var(--tx)"}">${Number(d.slice(8))}</b></div>`;
  }

  let grid = "";
  ROOMS.forEach((room, i) => {
    grid += `<div style="position:sticky;left:0;z-index:2;width:${LBL}px;height:${ROW}px;background:var(--bg1);border-bottom:1px solid var(--bd);
      display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--tx)">${esc(room.id)}</div>`;
  });
  for (let c = 0; c < calDays; c++) {
    const d = calAddDays(L.start, c);
    const wd = new Date(d + "T12:00:00Z").getUTCDay();
    const bg = d === today ? "#3b82f61a" : (wd === 0 || wd === 6) ? "#ffffff06" : "transparent";
    grid += `<div style="position:absolute;left:${LBL + c * COL}px;top:0;width:${COL}px;height:${ROW * ROOMS.length}px;background:${bg};border-left:1px solid var(--bd)"></div>`;
  }
  for (const k of L.conflicts)
    grid += `<div style="position:absolute;left:${LBL + k.col * COL}px;top:${k.row * ROW}px;width:${COL}px;height:${ROW}px;background:#ef444433"></div>`;

  for (const b of L.bars) {
    const color = b.block ? "#64748b" : (SRC_COLOR[b.source] || "#64748b");
    const h = (ROW * b.rowSpan - 6) / b.lanes;
    const top = b.row * ROW + 3 + b.lane * h;
    const left = LBL + b.col * COL + (b.clipLeft ? 0 : 3);
    const w = b.span * COL - (b.clipLeft ? 0 : 3) - (b.clipRight ? 0 : 3);
    const icon = b.kind === "cf" ? "🏡 " : b.kind === "suite" ? "🔗 " : "";
    const label = b.block ? "Bloqueio" : guestDisplay(b).text;
    const roomTxt = b.kind === "cf" ? "Casa Fechada" : b.kind === "suite" ? "Suíte 11+12" : "Quarto " + b.roomId;
    const tip = `${label} — ${roomTxt} — ${fmtDate(b.checkIn)} a ${fmtDate(b.checkOut)} (${nights(b.checkIn, b.checkOut)} noite(s))` +
      `${b.source ? " — " + b.source : ""}${b.pending ? " — pendente (não bloqueia)" : ""}${b.conflict ? " — CONFLITO" : ""}`;
    grid += `<div class="cal-bar" data-ids="${esc(b.ids.join(","))}" onclick="openEditModal('${esc(b.id)}')" title="${esc(tip)}"
      style="position:absolute;left:${left}px;top:${top}px;width:${Math.max(w, 8)}px;height:${Math.max(h - 2, 8)}px;cursor:pointer;overflow:hidden;
      background:${color}33;border:${b.pending ? "1px dashed" : "1px solid"} ${b.conflict ? "#ef4444" : color + "aa"};border-left:4px solid ${b.conflict ? "#ef4444" : color};

      opacity:${b.pending ? .6 : 1};font-size:11px;color:var(--tx);padding:0 5px;white-space:nowrap;text-overflow:ellipsis;
      display:flex;align-items:${b.rowSpan > 1 ? "flex-start;padding-top:4px" : "center"}">${b.clipLeft ? "‹ " : ""}${b.conflict ? "⚠️ " : ""}${icon}${esc(label)}</div>`;
  }

  const legendItem = (color, txt, dashed) => `<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px">
    <span style="width:14px;height:10px;border-radius:2px;background:${color}33;border:1px ${dashed ? "dashed" : "solid"} ${color};border-left-width:4px"></span>${txt}</span>`;
  const legend = `<div style="font-size:11px;color:var(--dm);margin-top:10px;line-height:2">
    ${legendItem(SRC_COLOR.direto, "Direto")}${legendItem(SRC_COLOR.booking, "Booking")}${legendItem(SRC_COLOR.airbnb, "Airbnb")}
    ${legendItem("#64748b", "Bloqueio")}${legendItem("#94a3b8", "Pendente (não bloqueia)", true)}<span style="margin-right:12px">⚠️ + fundo vermelho = conflito</span>
    <br>🏡 Casa Fechada = uma barra nos 9 quartos · 🔗 11+12 = uma barra nos 2 quartos · cada coluna é uma noite; saída no dia seguinte à última coluna ocupada.</div>`;

  return `${controls}${conflictMsg}
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--bd);border-radius:12px;background:var(--bg1)">
      <div style="position:relative;width:${width}px;height:${HEAD}px;border-bottom:1px solid var(--bd)">${head}</div>
      <div style="position:relative;width:${width}px;height:${ROW * ROOMS.length}px">${grid}</div>
    </div>${legend}`;
}

// Ocupação e caixa do mês, calculados no servidor a partir das linhas do banco.
let reportMonth = todayStr().slice(0, 7);
let reportData = null;
let reportError = null;
async function loadReport(month) {
  reportMonth = month;
  reportError = null;
  const d = await api("GET", `/reports/monthly?month=${encodeURIComponent(month)}`);
  if (d && d.occupancy && d.cash && d.month === month) reportData = d;
  else reportError = apiErrorMessage(d) || "Não foi possível carregar o relatório.";
  if (currentView === "relatorios") render();
}
function shiftReportMonth(delta) {
  const [y, m] = reportMonth.split("-").map(Number);
  const d = new Date(Date.UTC(y, m - 1 + delta, 1));
  loadReport(d.toISOString().slice(0, 7));
}
const ROOM_ORDER = ["10","11","12","20","21","22","23","24","25"];
function reportBar(label, value, max, valueText, tooltip) {
  const w = max > 0 ? Math.max(0, Math.min(100, (value / max) * 100)) : 0;
  return `<div title="${esc(tooltip)}" style="display:flex;align-items:center;gap:10px;padding:5px 0">
    <div style="width:64px;font-size:12px;color:var(--tx)">${esc(label)}</div>
    <div style="flex:1;height:10px;background:var(--bg0);border-radius:4px;overflow:hidden">
      <div style="width:${w}%;height:100%;background:var(--bl);border-radius:0 4px 4px 0"></div></div>
    <div style="width:118px;text-align:right;font-size:12px;color:var(--dm)">${esc(valueText)}</div></div>`;
}
function renderRelatorios() {
  const head = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
    <button class="btn" onclick="shiftReportMonth(-1)" aria-label="Mês anterior">‹</button>
    <div style="font-family:'Fraunces',serif;font-size:18px;font-weight:700">${esc((t => t.charAt(0).toUpperCase() + t.slice(1))(fmtMonth(reportMonth + "-01")))}</div>
    <button class="btn" onclick="shiftReportMonth(1)" aria-label="Próximo mês">›</button></div>`;
  if (reportError) return head + `<div style="color:#fca5a5">⚠️ ${esc(reportError)} <button class="btn" onclick="loadReport(reportMonth)">Tentar de novo</button></div>`;
  if (!reportData || reportData.month !== reportMonth) return head + `<div style="color:var(--mu)">Carregando…</div>`;
  const o = reportData.occupancy, c = reportData.cash;
  const tile = (label, value, sub, color) => `<div style="flex:1;min-width:150px;background:var(--bg1);border:1px solid var(--bd);border-radius:12px;padding:14px">
    <div style="font-size:12px;color:var(--mu);font-weight:700">${label}</div>
    <div style="font-size:clamp(18px,5vw,24px);font-weight:700;white-space:nowrap;color:${color || "var(--tx)"};margin-top:4px">${value}</div>
    <div style="font-size:11px;color:var(--mu);margin-top:2px">${sub}</div></div>`;
  const card = (title, body) => `<div style="background:var(--bg1);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px">
    <div style="font-size:13px;color:var(--mu);font-weight:700;margin-bottom:10px">${title}</div>${body}</div>`;
  const chLabel = { direto: "Direto", airbnb: "Airbnb", booking: "Booking", outro: "Outro" };
  const chRows = Object.entries(o.channels).filter(([k, v]) => v > 0 || k !== "outro")
    .map(([k, v]) => reportBar(chLabel[k] || k, v, o.occupied, `${v} noites · ${o.occupied ? Math.round(v / o.occupied * 100) : 0}%`,
      `${chLabel[k] || k}: ${v} de ${o.occupied} noites ocupadas`)).join("");
  const roomRows = ROOM_ORDER.map(id => {
    const r = o.rooms[id] || { occupied: 0, pct: 0, conflicts: 0 };
    return reportBar(`Qto ${id}`, r.occupied, o.days, `${r.occupied}/${o.days} · ${String(r.pct).replace(".", ",")}%${r.conflicts ? " ⚠️" : ""}`,
      `Quarto ${id}: ${r.occupied} de ${o.days} noites com hóspede (${r.pct}%)` + (r.conflicts ? ` — ${r.conflicts} noite(s) com duas reservas` : ""));
  }).join("");
  const line = (label, value, strong, color) => `<tr><td style="padding:5px 0;color:${strong ? "var(--tx)" : "var(--dm)"};font-weight:${strong ? 700 : 400}">${label}</td>
    <td style="padding:5px 0;text-align:right;font-weight:${strong ? 700 : 400};color:${color || "var(--tx)"}">${value}</td></tr>`;
  return head + `
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
      ${tile("Ocupação", `${String(o.pct).replace(".", ",")}%`, `${o.occupied} de ${o.available} noites (9 quartos × ${o.days} dias)`)}
      ${tile("Resultado do mês", fmtMoney(c.result), "recebido − estornos + outras receitas − despesas", c.result < 0 ? "var(--rd)" : "var(--tx)")}
      ${c.paymentsOn ? tile("A receber no mês", fmtMoney(c.receivableInMonth), `${c.counts.dueInMonth} parcela(s) com vencimento no mês`) : ""}
      ${c.paymentsOn && c.overdueTotal > 0 ? tile("🔴 Vencidas", fmtMoney(c.overdueTotal), `${c.counts.overdue} parcela(s), todos os meses`, "var(--rd)") : ""}
    </div>
    ${card("Ocupação por quarto", roomRows +
      (o.conflicts ? `<div style="font-size:11px;color:var(--dm);margin-top:8px">⚠️ ${o.conflicts} noite(s) com duas reservas no mesmo quarto (contadas uma vez). Veja os Alertas.</div>` : ""))}
    ${card("Noites ocupadas por canal", chRows +
      `<div style="font-size:11px;color:var(--mu);margin-top:8px">No Booking toda linha importada se chama "CLOSED", inclusive datas fechadas manualmente: elas contam como ocupação.` +
      (o.blockedOnly ? ` Bloqueios do Airbnb sem hóspede (não contados): ${o.blockedOnly} noite(s).` : "") + `</div>`)}
    ${card("Caixa do mês", `<table style="width:100%;font-size:12px;border-collapse:collapse">
      ${line("Recebido de reservas diretas", fmtMoney(c.received))}
      ${line("(−) Estornos devolvidos", fmtMoney(c.refunded))}
      ${line("Outras receitas do Financeiro", fmtMoney(c.otherIncome))}
      ${line("(−) Despesas do Financeiro", fmtMoney(c.expenses))}
      ${line("= Resultado", fmtMoney(c.result), true, c.result < 0 ? "var(--rd)" : "var(--tx)")}
    </table>
    <div style="font-size:11px;color:var(--mu);margin-top:8px">Airbnb e Booking não entram no caixa do PMS (a plataforma repassa). ${c.counts.payments} pagamento(s) e ${c.counts.transactions} lançamento(s) neste mês.${c.paymentsOn ? "" : " Pagamentos ainda não ativados."}</div>`)}`;
}

function getCasaFechadaToday() {
  const t = todayStr();
  // reserva de casa fechada ativa hoje (qualquer quarto com nota [Casa toda:])
  return reservations.find(r =>
    r.status !== "cancelled" &&
    r.notes && r.notes.includes("[Casa toda:") &&
    r.checkIn <= t && r.checkOut > t
  ) || null;
}
function getCasaFechadaCheckin() {
  const t = todayStr();
  return reservations.find(r =>
    r.status !== "cancelled" &&
    r.notes && r.notes.includes("[Casa toda:") &&
    r.checkIn === t
  ) || null;
}
function getCasaFechadaCheckout() {
  const t = todayStr();
  return reservations.find(r =>
    r.status !== "cancelled" &&
    r.notes && r.notes.includes("[Casa toda:") &&
    r.checkOut === t
  ) || null;
}

// Cartão de quarto: superfície neutra, faixa e etiqueta na cor do estado (o estado
// vem escrito, não só pela cor), hóspede e data de saída. Um desenho só para
// todos os quartos, inclusive 11 e 12 dentro da suíte.
// Nome para exibir. O iCal do Airbnb/Booking não traz o nome do hóspede: chega
// "Reserved", "CLOSED - Not available" etc. Mostra o canal em vez do texto do feed.
// Só exibição: o dado no banco não muda.
const SRC_LABEL = { direto: "Direto", booking: "Booking", airbnb: "Airbnb" };
function guestDisplay(r) {
  const n = String((r && r.guestName) || "").trim();
  const src = SRC_LABEL[r && r.source] || "";
  if (r && r.source === "airbnb" && CAL_BLOCK_RE.test(n)) return { text: "Bloqueio Airbnb", generic: true };
  if (!n || GENERIC_NAMES.test(n)) return { text: src ? `${src} · sem nome` : "Sem nome", generic: true };
  return { text: n, generic: false };
}

function roomCardHtml(room, st, res, cf) {
  const s = STATUS[st] || STATUS.free;
  const g = res ? guestDisplay(res) : null;
  const src = res && SRC_LABEL[res.source] ? ` · ${SRC_LABEL[res.source]}` : "";
  const out = res && res.checkOut ? `<div class="rc-out">sai ${esc(fmtDate(res.checkOut).slice(0, 5))}${esc(src)}</div>` : "";
  return `<div class="room-card st-${esc(st)}" style="--sc:${s.color}" onclick="handleRoomClick('${esc(room.id)}')"
    title="Quarto ${esc(room.id)} — ${esc(s.label)}${g ? " — " + esc(g.text) : ""}">
    <div class="rc-top"><span class="room-num">${esc(room.id)}</span><span class="rc-chip">${s.icon} ${esc(s.label)}</span></div>
    <div class="room-type">${esc(room.type)} · <span class="nw">${room.climate === "AC" ? "❄ AC" : "💨 Vent."}</span></div>
    ${res ? `<div class="rc-guest${g.generic ? " rc-empty" : ""}">${esc(g.text)}</div>${out}` : ""}
    ${!cf && st === "checkin" ? `<button class="clean-btn rc-act" onclick="markCheckedIn('${esc(room.id)}',event)">✓ Check-in feito</button>` : ""}
    ${!cf && st === "cleaning" ? `<button class="clean-btn rc-act" onclick="markClean('${esc(room.id)}',event)">✓ Limpo</button>` : ""}
    ${(() => { const k = !cf && undoableMark(room.id); return k
      ? `<button class="rc-undo" onclick="unmarkRoomState('${esc(room.id)}','${k}',event)">↩ Desfazer ${UNDO_LABEL[k]}</button>` : ""; })()}
  </div>`;
}

function renderMap() {
  const t        = todayStr();
  const cfAtiva    = getCasaFechadaToday();
  const cfCheckin  = getCasaFechadaCheckin();
  const cfCheckout = getCasaFechadaCheckout();

  // Se há Casa Fechada, todos os quartos são contados como ocupados
  const occupied = cfAtiva
    ? ROOMS.map(r => ({roomId: r.id}))  // virtual: todos ocupados
    : reservations.filter(r=>r.status!=="cancelled"&&r.checkIn<=t&&r.checkOut>t);

  // Check-ins e check-outs: se CF, mostra 1 (a pousada toda)
  const checkins  = cfCheckin  ? [{roomId:"CF"}]
    : reservations.filter(r=>r.checkIn===t&&r.status!=="cancelled"&&!(r.notes&&r.notes.includes("[Casa toda:")));
  const checkouts = cfCheckout ? [{roomId:"CF"}]
    : reservations.filter(r=>r.checkOut===t&&r.status!=="cancelled"&&!(r.notes&&r.notes.includes("[Casa toda:")));

  // KPIs

  [
    [cfAtiva ? ROOMS.length : occupied.length, "#ef4444","Ocupados"],

    [cfAtiva ? 0 : cleaning.length, "#a855f7","Em Limpeza"],
    [cfAtiva ? 0 : ROOMS.length - occupied.length - cleaning.length, "#22c55e","Disponíveis"],
  ].forEach(([v,c,l])=>{

  });
  html+=`</div>`;

  // Banner Casa Fechada
  if (cfAtiva) {
    html+=`<div style="background:#0f1e2b;border:1px solid #3b82f644;border-radius:10px;padding:12px 18px;

      <div>
        <div style="font-size:13px;font-weight:700;color:#3b82f6">Casa Fechada</div>
        <div style="font-size:11px;color:var(--mu);margin-top:2px">
          ${esc(cfAtiva.guestName)} · ${fmtDate(cfAtiva.checkIn)} → ${fmtDate(cfAtiva.checkOut)}
        </div>
      </div>
      <span class="pill" style="background:#3b82f622;color:#3b82f6;margin-left:auto">CF</span>
    </div>`;
  }

  // Legend
  html+=`<div class="legend">`;
  Object.entries(STATUS).forEach(([k,v])=>{
    html+=`<div class="legend-item"><div class="legend-dot" style="background:${v.color}"></div>${v.label}</div>`;
  });
  html+=`</div>`;

  // Room grid — quartos 11 e 12 aparecem agrupados como suíte
  html+=`<div class="room-grid">`;
  ROOMS.forEach(room=>{
    // Quarto 11 → abre o bloco da suíte
    if (room.id==="11") {
      const st11 = cfAtiva ? "occupied" : getRoomStatus("11");
      const st12 = cfAtiva ? "occupied" : getRoomStatus("12");
      const res11= cfAtiva ? cfAtiva : getRoomRes("11");
      const res12= cfAtiva ? cfAtiva : getRoomRes("12");
      const suiteOccupied = ["11","12"].every(id=>["occupied","checkin"].includes(getRoomStatus(id)));
      const bothFree      = ["11","12"].every(id=>getRoomStatus(id)==="free");

      html+=`<div class="suite-group">
        <div class="suite-label">🔗 Suíte 11+12</div>
        <div class="suite-rooms">
          ${roomCardHtml(ROOMS.find(r=>r.id==="11"), st11, res11, !!cfAtiva)}

        ${bothFree

            : ""}
      </div>`;
      return; // pula o render individual do 11
    }
    if (room.id==="12") return; // já renderizado dentro da suíte

    // Casa Fechada: todos os quartos ocupados
    const st  = cfAtiva ? "occupied" : getRoomStatus(room.id);
    const s   = STATUS[st];
    const res = cfAtiva ? cfAtiva : getRoomRes(room.id);
    html+=roomCardHtml(room, st, res, !!cfAtiva);
  });
  html+=`</div>`;

  // Hoje agenda
  if (checkins.length||checkouts.length) {
    html+=`<div class="agenda"><div class="section-title">Hoje</div>

    [["Chegadas (check-in)",checkins,"#3b82f6","#0f1e2b"],["Saídas (check-out)",checkouts,"#f59e0b","#2b1e0a"]].forEach(([lbl,list,clr,bg])=>{

          <span class="agenda-room" style="color:${clr}">${r.roomId}</span>
          <div>

          </div>
        </div>`;
      });
      html+=`</div>`;
    });
    html+=`</div></div>`;
  }
  return html;
}

function isSuiteRes(r) {
  if (r.roomId!=="11" && r.roomId!=="12") return false;
  // 1) marcado explicitamente nas notas
  if (r.notes && (r.notes.includes("[Suíte grupo:") || r.notes.includes("Suíte 11+12"))) return true;
  return false;
}

// Deduplica reservas de Casa Fechada — mostra 1 linha com "CF"
function groupCasaFechada(list) {
  const seen = new Set();
  return list.reduce((acc, r) => {
    if (r.notes && r.notes.includes("[Casa toda:")) {
      // Sempre agrupa por hóspede+datas — garante deduplicação
      // independente de como a chave interna foi gerada por quarto
      const key = `cf-${r.guestName}-${r.checkIn}-${r.checkOut}`;
      if (seen.has(key)) return acc;
      seen.add(key);
      acc.push({ ...r, roomId: "CF", _isCFRow: true });
    } else {
      acc.push(r);
    }
    return acc;
  }, []);
}

// Retorna chave de agrupamento para um quarto 11 ou 12
function suiteKey(r) {
  // prioridade: ID de grupo explícito nas notas
  const m = (r.notes||"").match(/\[Suíte grupo:([^\]]+)\]/);
  if (m) return "grp-" + m[1];
  // fallback: mesmo hóspede + mesmas datas (cobre importações iCal)
  return `pair-${r.guestName}-${r.checkIn}-${r.checkOut}`;
}

// Agrupa reservas de suíte para exibir como uma linha só
function groupSuiteReservations(list) {
  const grouped = [];
  const seen = new Set();

  list.forEach(r=>{
    if (r.roomId!=="11" && r.roomId!=="12") {
      grouped.push(r); return;
    }
    // Se é Casa Fechada, não agrupa como suíte — já será deduplicado abaixo
    if (r.notes && r.notes.includes("[Casa toda:")) {
      grouped.push(r); return;
    }
    // Quarto 11 ou 12 — verifica se existe par no mesmo período
    const hasPair = list.some(o =>
      o.id !== r.id &&
      ((r.roomId==="11" && o.roomId==="12") || (r.roomId==="12" && o.roomId==="11")) &&
      o.checkIn === r.checkIn && o.checkOut === r.checkOut &&
      o.status === r.status
    );

    if (hasPair) {
      // Agrupa como suíte — mostra apenas uma linha
      const key = suiteKey(r) || `pair-${r.guestName}-${r.checkIn}-${r.checkOut}`;
      if (seen.has(key)) return;
      seen.add(key);
      grouped.push({ ...r, roomId:"11+12", _isSuiteRow:true });
    } else {
      // Quarto 11 ou 12 reservado individualmente — mostra normal
      grouped.push(r);
    }
  });
  return grouped;
}

function resRow(r) {
  const isCasaToda = r._isCFRow || (r.notes && r.notes.includes("[Casa toda:"));
  const isSuite  = !isCasaToda && (r._isSuiteRow || isSuiteRes(r));
  const roomLabel= isCasaToda ? "CF" : isSuite ? "11+12" : r.roomId;
  const room     = isCasaToda ? {type:"Casa Fechada — pousada toda"}
                 : isSuite    ? {type:"Suíte (Triplo ×2, Ventilador)"}
                 : ROOMS.find(rm=>rm.id===r.roomId);
  const n        = nights(r.checkIn, r.checkOut);
  const srcClr   = SRC_COLOR[r.source]||"var(--mu)";
  const cancelled= r.status==="cancelled";
  return `<div class="res-row" style="opacity:${cancelled?.45:1}" onclick="openEditModal('${r.id}')">
    <div class="res-id" style="${isCasaToda?"border:1px solid #3b82f655;color:#3b82f6;font-size:13px;background:#0f1e2b":isSuite?"border:1px solid #f59e0b55;color:#f59e0b;font-size:13px":""}">${roomLabel}</div>
    <div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px">
        ${esc(r.guestName)}
        ${isCasaToda?`<span class="pill" style="background:#3b82f622;color:#3b82f6">🏡 CF</span>`:""}
        ${isSuite?`<span class="pill" style="background:#f59e0b22;color:#f59e0b">🔗 suíte</span>`:""}
      </div>
      <div style="font-size:11px;color:var(--mu);margin-top:3px">
        ${room?.type||""} · ${fmtDate(r.checkIn)} → ${fmtDate(r.checkOut)}
        · <b style="color:var(--dm)">${n} noite${n!==1?"s":""}</b>
        ${r.phone?` · ${esc(r.phone)}`:""}    
      </div>
    </div>
    <div style="display:flex;gap:7px;align-items:center;flex-shrink:0">
      <span class="pill" style="background:${srcClr}28;color:${srcClr}">${r.source}</span>
      ${cancelled?`<span class="pill" style="background:#ef444428;color:#ef4444">cancelado</span>`:""}
      <span style="color:var(--bd);font-size:20px">›</span>
    </div>
  </div>`;
}

// ─── HÓSPEDES VIEW ────────────────────────────────────────────────────────────
// Reservas ligadas a um hóspede: mesmo nome (sem diferença de maiúsculas/espaços)
// ou mesmo telefone com pelo menos 8 dígitos. Antes, telefone vazio casava com
// todas as reservas sem telefone (as importadas), e a contagem ia a centenas.
const onlyDigits = s => String(s || "").replace(/\D/g, "");
const normName   = s => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
function reservationsOfGuest(g) {
  const name  = normName(g.name);
  const phone = onlyDigits(g.phone);
  if (!name && phone.length < 8) return [];
  return reservations.filter(r =>
    (name && normName(r.guestName) === name) ||
    (phone.length >= 8 && onlyDigits(r.phone) === phone));
}
// Conta estadias, não linhas: Casa Fechada (9 linhas) e 11+12 (2 linhas) contam uma vez.
function guestStayCount(g) {
  const keys = new Set();
  for (const r of reservationsOfGuest(g)) {
    if (r.status === "cancelled") continue;
    const m = (r.notes || "").match(/\[(Casa toda|Suíte grupo):([^\]]+)\]/);
    keys.add(m ? m[1] + ":" + m[2] : r.id);
  }
  return keys.size;
}

        (g.phone||"").includes(q) ||
        (g.cpf||"").includes(q) ||
        (g.email||"").toLowerCase().includes(q)

  let html = `
  <div style="display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap">
    <input id="guest-search-input" value="${esc(guestSearch)}"
      placeholder="🔍 Buscar por nome, telefone, CPF ou e-mail..."

      oninput="guestSearch=this.value;render()">

  </div>`;

  if (!list.length) {
    html += `<div style="text-align:center;color:var(--mu);padding:48px 0;font-size:14px">
      ${q ? `Nenhum hóspede encontrado para "${guestSearch}"` : "Nenhum hóspede cadastrado ainda."}
    </div>`;
    return html;
  }

  html += `<div style="display:flex;flex-direction:column;gap:8px">`;
  list.forEach(g => {
    const resCount = guestStayCount(g);
    html += `<div style="background:var(--bg1);border:1px solid var(--bd);border-radius:12px;
      padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer"
      onclick="openGuestModal('${g.id}')">
      <div style="width:40px;height:40px;border-radius:50%;background:var(--bg3);
        display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">
        👤
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:14px">${esc(g.name)}</div>
        <div style="font-size:11px;color:var(--mu);margin-top:3px">
          ${g.phone ? "📞 "+esc(g.phone) : ""}
          ${g.email ? " · ✉ "+esc(g.email) : ""}
          ${g.cpf   ? " · 🪪 "+esc(g.cpf)  : ""}
        </div>
      </div>
      <div style="flex-shrink:0;text-align:right">
        <div style="font-size:12px;color:var(--dm);font-weight:600">${resCount} reserva${resCount!==1?"s":""}</div>
        ${g.address?`<div style="font-size:10px;color:var(--mu);margin-top:2px">📍 ${esc(g.address)}</div>`:""}
      </div>

  });
  html += `</div>`;
  return html;

function openGuestModal(guestId) {
  const g = guestId ? (guests.find(x => x.id === guestId) || {}) : {};
  const isEdit = !!guestId;
  // reservas vinculadas a esse hóspede
  const guestRes = isEdit ? reservationsOfGuest(g) : [];

  document.getElementById("modal-title").innerHTML =
    `${isEdit?"👤 Editar Hóspede":"👤 Novo Hóspede"} <button onclick="closeModal()">×</button>`;
  document.getElementById("modal-body").innerHTML = `
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
      <div class="field"><label>Nome *</label>
        <input id="g-name" value="${esc(g.name||"")}" placeholder="Nome completo"></div>
      <div class="row2">
        <div class="field"><label>Telefone / WhatsApp</label>
          <input id="g-phone" value="${esc(g.phone||"")}" placeholder="(44) 99999-9999"></div>
        <div class="field"><label>E-mail</label>
          <input id="g-email" value="${esc(g.email||"")}" placeholder="email@exemplo.com"></div>
      </div>
      <div class="row2">
        <div class="field"><label>CPF / Documento</label>
          <input id="g-cpf" value="${esc(g.cpf||"")}" placeholder="000.000.000-00"
            ${String(g.cpf||"").includes("*") ? 'readonly title="CPF visível só para o administrador"' : ""}></div>
        <div class="field"><label>Endereço / Cidade</label>
          <input id="g-address" value="${esc(g.address||"")}" placeholder="Cidade, Estado"></div>
      </div>
      <div class="field"><label>Observações</label>
        <textarea id="g-notes">${esc(g.notes||"")}</textarea></div>
    </div>
    ${guestRes.length ? `
    <div style="margin-bottom:20px">
      <div style="font-size:13px;color:var(--mu);font-weight:700;margin-bottom:10px">
        Histórico (${guestRes.length} reserva${guestRes.length!==1?"s":""})
      </div>
      ${guestRes.slice(0,5).map(r=>`
        <div style="background:var(--bg0);border-radius:8px;padding:8px 12px;margin-bottom:6px;
          font-size:12px;display:flex;justify-content:space-between;align-items:center">
          <span>Qto ${esc(r.roomId)} · ${fmtDate(r.checkIn)} → ${fmtDate(r.checkOut)}</span>
          <span style="color:var(--mu)">${esc(r.source)}</span>
        </div>`).join("")}
    </div>` : ""}

      ${isEdit?`<button class="btn btn-red" onclick="deleteGuest('${g.id}')">Excluir</button>`:""}
      <button class="btn btn-green" onclick="saveGuest(${isEdit?`'${g.id}'`:"null"})">
        ${isEdit?"Salvar Alterações":"Cadastrar Hóspede"}
      </button>
    </div>`;
  document.getElementById("modal").style.display = "flex";
}

async function saveGuest(id) {
  const g = {
    id:      id || Math.random().toString(36).slice(2,10),
    name:    document.getElementById("g-name")?.value.trim(),
    phone:   document.getElementById("g-phone")?.value.trim(),
    email:   document.getElementById("g-email")?.value.trim(),
    cpf:     document.getElementById("g-cpf")?.value.trim(),
    address: document.getElementById("g-address")?.value.trim(),
    notes:   document.getElementById("g-notes")?.value.trim(),
  };
  if (!g.name) { alert("Nome é obrigatório"); return; }
  if (!(await apiWrite("POST", "/guests", g, "salvar o hóspede"))) return;
  closeModal();
  await loadAll();
}

async function deleteGuest(id) {
  if (!confirm("Excluir este hóspede? As reservas não serão afetadas.")) return;
  if (!(await apiWrite("DELETE", "/guests/"+id, null, "excluir o hóspede"))) return;
  closeModal();
  await loadAll();
}

function fmtMoney(v) {
  return "R$ " + Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtMonthLabel(m) {
  const [y,mo] = m.split("-");
  const months = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  return months[+mo-1]+" "+y;
}

async function loadTransactions(month) {
  if (authRole !== "admin") return;
  const data = await api("GET", "/transactions?month="+month);
  if (Array.isArray(data)) transactions = data;
  else loadError = "Não foi possível carregar o financeiro deste mês.";
  if (paymentsEnabled) {
    const rec = await api("GET", "/payments/receivable");
    if (Array.isArray(rec)) receivables = rec;
  }
  render();
}

      <div class="fin-kpi" style="font-weight:700;color:#22c55e;font-family:'Fraunces',serif">${fmtMoney(totIn)}</div>
    </div>

      <div style="font-size:13px;color:#ef4444;font-weight:700;margin-bottom:6px">Despesas</div>
