function renderFinChart(income, expense) {
  // Agrega por categoria
  const incByCat = {}, expByCat = {};
  income.forEach(t  => { incByCat[t.category] = (incByCat[t.category]||0)+Number(t.amount); });
  expense.forEach(t => { expByCat[t.category] = (expByCat[t.category]||0)+Number(t.amount); });

  const allInc = Object.entries(incByCat).sort((a,b)=>b[1]-a[1]);
  const allExp = Object.entries(expByCat).sort((a,b)=>b[1]-a[1]);
  const maxVal = Math.max(...allInc.map(x=>x[1]), ...allExp.map(x=>x[1]), 1);

  if (!allInc.length && !allExp.length) return "";

  const bar = (cat, val, color) => {
    const pct = Math.round((val/maxVal)*100);
    const info = FIN_CATEGORIES[cat] || {label:cat, icon:"•"};
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <div style="font-size:13px;width:20px;text-align:center">${info.icon}</div>
      <div style="font-size:11px;color:var(--mu);width:120px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${info.label}</div>
      <div style="flex:1;background:var(--bg0);border-radius:4px;height:16px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${color};border-radius:4px;transition:width .3s"></div>
      </div>
      <div style="font-size:11px;font-weight:600;color:var(--tx);width:90px;text-align:right;flex-shrink:0">${fmtMoney(val)}</div>
    </div>`;
  };

  return `<div style="background:var(--bg1);border:1px solid var(--bd);border-radius:12px;padding:16px">
    <div style="font-size:13px;color:var(--mu);font-weight:700;margin-bottom:14px">Distribuição do mês</div>
    ${allInc.length ? `<div style="font-size:12px;color:#22c55e;font-weight:700;margin-bottom:8px">Entradas</div>
      ${allInc.map(([k,v])=>bar(k,v,"#22c55e")).join("")}` : ""}
    ${allExp.length ? `<div style="font-size:12px;color:#ef4444;font-weight:700;margin:12px 0 8px">Saídas</div>
      ${allExp.map(([k,v])=>bar(k,v,"#ef4444")).join("")}` : ""}
  </div>`;
}

function renderFinList(type, list) {
  const isIncome = type === "income";
  const color    = isIncome ? "#22c55e" : "#ef4444";
  const title    = isIncome ? "Entradas" : "Saídas";

  if (!list.length) return `
    <div style="background:var(--bg1);border:1px solid var(--bd);border-radius:12px;padding:16px">
      <div style="font-size:13px;color:${color};font-weight:700;margin-bottom:12px">${title}</div>
      <div style="text-align:center;color:var(--mu);padding:24px 0;font-size:13px">Nenhum lançamento</div>
    </div>`;

  return `
    <div style="background:var(--bg1);border:1px solid var(--bd);border-radius:12px;padding:16px">
      <div style="font-size:13px;color:${color};font-weight:700;margin-bottom:12px">${title}</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${list.map(t => {
          const cat  = FIN_CATEGORIES[t.category] || {label:t.category, icon:"•"};
          // Pagamentos de reserva (PMS-007) são somente leitura aqui: edita-se na reserva.
          const click = t.readonly
            ? (reservations.some(r => r.id === t.reservation_id) ? `onclick="openEditModal('${esc(t.reservation_id)}')"` : "")
            : `onclick="openTransactionModal('${esc(t.id)}')"`;
          return `<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;
            background:var(--bg0);border-radius:8px;cursor:pointer" ${click}>
            <span style="font-size:16px">${cat.icon}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.readonly ? "💳 " : ""}${esc(t.description)}</div>
              <div style="font-size:10px;color:var(--mu);margin-top:1px">${esc(cat.label)} · ${esc(fmtDate(t.date))}${t.readonly ? " · via reserva" : ""}</div>
            </div>
            <div style="font-size:13px;font-weight:700;color:${color};flex-shrink:0">${fmtMoney(t.amount)}</div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
}

function changeFinMonth(month) {
  finMonth = month;
  loadTransactions(month);
}

function openTransactionModal(id) {
  const t = id ? (transactions.find(x=>x.id===id)||{}) : {};
  const isEdit = !!id;
  const today  = new Date().toISOString().split("T")[0];

  const incCats = Object.entries(FIN_CATEGORIES).filter(([,v])=>v.type==="income");

async function saveTransaction(id) {
  const t = {
    id:          id || Math.random().toString(36).slice(2,10),
    type:        document.getElementById("ft-type")?.value,
    category:    document.getElementById("ft-cat")?.value,

// ─── ALERTAS VIEW ─────────────────────────────────────────────────────────────
// Overbooking que ainda dá para resolver: mesmo quarto, noites em comum, e a
// última noite em comum é hoje ou depois. Sobreposição que já terminou (ex.:
// duplicatas antigas de importação do histórico) não vira alerta — era isso que
// fazia a tela mostrar 85 "conflitos", todos de estadias passadas. Mesma janela
// da constraint do banco (reservations_no_overlap). [check_in, check_out).
function findOverbookings(list = reservations, today = todayStr()) {
  const active = list.filter(r => occupies(r) && r.checkOut > today);
  const out = [];
  for (let i = 0; i < active.length; i++)
    for (let j = i + 1; j < active.length; j++) {
      const a = active[i], b = active[j];
      if (a.roomId !== b.roomId) continue;
      // As duas saem depois de hoje, então as noites em comum incluem hoje ou depois.
      if (a.checkIn >= b.checkOut || b.checkIn >= a.checkOut) continue;
      out.push({ key: [a.id, b.id].sort().join("|"), a, b });
    }
  return out;
}

function renderAlertas() {
  const confirmed = reservations.filter(occupies);
  const conflicts = findOverbookings();

  // Também detecta pré-reservas que conflitam com reservas confirmadas
  const preConflicts = [];
  for (const pre of prereservations) {
    if (!pre.check_in || !pre.check_out) continue;
    if (pre.check_out <= todayStr()) continue; // pré-reserva que já passou não é alerta
    if (pre.status === "recusado") continue;
    const norm = { roomId: pre.room_id, checkIn: pre.check_in, checkOut: pre.check_out };
    const clash = confirmed.find(r =>
      r.roomId === norm.roomId &&
      r.checkIn < norm.checkOut &&
      r.checkOut > norm.checkIn
    );
    if (clash) preConflicts.push({ pre, clash });
  }

  const total = conflicts.length + preConflicts.length;

  let html = `<div style="margin-bottom:20px">`;

  if (total === 0) {
    html += `<div style="text-align:center;padding:60px 0">
      <div style="font-size:48px;margin-bottom:12px">✅</div>

function renderPreReservas() {
  const today = todayStr();
  const active   = prereservations.filter(p => p.status !== "recusado" && (!p.check_out || p.check_out >= today));
  const past     = prereservations.filter(p => p.status === "recusado"  || (p.check_out && p.check_out < today));

  let html = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px">
    <div style="font-size:13px;color:var(--mu)">

    </div>

    html += `<div style="text-align:center;color:var(--mu);padding:48px 0;font-size:14px">
      Nenhuma pré-reserva cadastrada. Use para anotar leads e hóspedes interessados.

    return html;

  const renderGroup = (list, title, color) => {
    if (!list.length) return "";
    let s = `<div style="font-size:13px;color:${color};font-weight:700;margin:20px 0 10px">${title}</div>`;
    list.forEach(p => {
      const st = PRE_STATUS[p.status] || PRE_STATUS.aguardando;

      const n = p.check_in && p.check_out ? Math.max(0,Math.round((new Date(p.check_out)-new Date(p.check_in))/86400000)) : 0;
      // Checa conflito com reservas confirmadas
      const hasConflict = p.check_in && p.check_out && p.status !== "recusado" &&
        reservations.some(r =>
          r.roomId === p.room_id && r.status !== "cancelled" &&
          r.checkIn < p.check_out && r.checkOut > p.check_in
        );
      s += `<div style="background:var(--bg2);border:1.5px solid ${hasConflict?"#ef444466":st.color+"33"};

        onclick="openPreReservaModal('${esc(p.id)}')">

          font-size:16px;font-weight:800;color:${st.color};flex-shrink:0">
          ${esc(p.room_id||"?")}

        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px">
            ${esc(p.guest_name||"Sem nome")}
            ${hasConflict ? `<span class="pill" style="background:#ef444422;color:#ef4444">⚠️ conflito</span>` : ""}
          </div>
          <div style="font-size:11px;color:var(--mu);margin-top:3px">
            ${room ? room.type+" · " : ""}
            ${p.check_in ? fmtDate(p.check_in)+" → "+fmtDate(p.check_out) : "Datas não definidas"}
            ${n > 0 ? ` · <b style="color:var(--dm)">${n} noite${n!==1?"s":""}</b>` : ""}
            ${p.phone ? ` · 📞 ${esc(p.phone)}` : ""}
          </div>
          ${p.notes ? `<div style="font-size:11px;color:var(--dm);margin-top:5px;padding:6px 10px;
            background:var(--bg0);border-radius:6px;white-space:pre-wrap">${esc(p.notes)}</div>` : ""}
        </div>
        <div style="flex-shrink:0;text-align:right">
          <span class="pill" style="background:${st.bg};color:${st.color}">${st.label}</span>
        </div>
      </div>`;
    });
    return s;
  };

  html += renderGroup(active, "Ativas ou aguardando", "#f59e0b");
  html += renderGroup(past,   "Passadas ou recusadas", "var(--mu)");
  return html;
}

// ─── URLs de exportação (PMS-012: nunca ficar em "Carregando…" para sempre) ───
// Estado explícito: idle → loading → ok | error. Erro sempre vira mensagem na tela.
let calUrlsState = "idle";
let calUrls = null;
let calUrlsError = null;
let calChannels = null; // PMS-010 passo 2: { airbnb: {anúncio: url}, booking: {...} }
async function loadCalUrls() {
  if (calUrlsState === "loading") return;
  calUrlsState = "loading";
  const r = await api("GET", "/calendar-urls");
  if (r && r.urls && typeof r.urls === "object") {
    calUrls = r.urls; calChannels = r.channels || null; calUrlsError = null; calUrlsState = "ok";
  } else {
    calUrls = null; calUrlsState = "error";
    if (r && r.code === "CALENDAR_TOKEN_MISSING") {
      calUrlsError = "As URLs novas (com token) ainda não estão ativas: falta a variável CALENDAR_TOKEN no Render. " +
        "As URLs que já estão cadastradas no Booking/Airbnb continuam funcionando. " +
        "Não troque nada nas plataformas agora: a troca faz parte do plano de transição (PMS-010).";
    } else {
      calUrlsError = apiErrorMessage(r) || "Não foi possível carregar as URLs de exportação.";
    }
  }
  const el = document.getElementById("cal-urls-section");
  if (el) el.innerHTML = renderCalUrls();
}

function renderCalUrls() {
  if (calUrlsState === "idle") loadCalUrls();
  if (calUrlsState === "error") {
    return `<div style="color:#f59e0b;font-size:12px;padding:8px 0;line-height:1.6">
      ⚠️ ${calUrlsError}
      <div style="margin-top:8px"><button class="btn" onclick="calUrlsState='idle';document.getElementById('cal-urls-section').innerHTML=renderCalUrls()">Tentar de novo</button></div>
    </div>`;
  }
  if (calUrlsState !== "ok" || !calUrls) {
    return `<div style="color:var(--mu);font-size:12px">Carregando URLs…</div>`;
  }
  return calUrlRowsHtml(calChannels) + calGeneralUrlsHtml(calUrls);
}

// Links gerais (todas as origens) continuam existindo para não quebrar nada já
// cadastrado (regra 3), mas ficam recolhidos: num anúncio de OTA eles devolvem
// as reservas do próprio anúncio.

  const order = ["CF", "11+12", "10", "11", "12", "20", "21", "22", "23", "24", "25"];

      <input readonly value="${esc(urls[id])}" style="flex:1;min-width:0;background:var(--bg0);border:1px solid var(--bd);border-radius:6px;
        color:var(--dm);padding:5px 10px;font-size:10px;outline:none;font-family:var(--mono);cursor:pointer"
        onclick="this.select()" title="Clique para selecionar">
      <button class="btn" onclick="copyCalUrl('${esc(urls[id])}')">Copiar</button>

function copyCalUrl(url) {
  navigator.clipboard.writeText(url).then(() => {
    alert("URL copiada!\n\n" + url);

    prompt("Copie a URL abaixo:", url);
  });
}

// ─── Quem consulta os calendários do PMS (PMS-010, passo 1) ───────────────────
// Inventário para decidir com segurança a troca de links (regra 3).
let feedInventory = null;
async function loadFeedInventory() {
  const d = await api("GET", "/calendar/inventory");
  feedInventory = d && Array.isArray(d.feeds) ? d.feeds : [];
  render();
}
function renderFeedInventory() {
  const head = `<div style="margin-top:20px;font-size:13px;color:var(--mu);font-weight:700">Quem consulta os calendários do PMS</div>`;
  if (feedInventory === null)
    return `${head}<button class="btn" style="margin-top:8px" onclick="loadFeedInventory()">📋 Ver inventário de acessos</button>`;
  if (!feedInventory.length)
    return `${head}<div style="font-size:12px;color:var(--mu);margin-top:8px">Nenhum acesso registrado ainda (o registro começou com esta versão).</div>`;
  const rows = feedInventory
    .sort((a, b) => (a.variant + a.room).localeCompare(b.variant + b.room))
    .flatMap(f => Object.entries(f.agents || {}).map(([agent, a]) => `<tr>
      <td>${f.variant === "token" ? "🔒 com token" : "🔓 antigo (sem token)"}</td>
      <td>${esc(f.room === "CF" ? "Casa Fechada" : f.room)}</td><td>${esc(agent)}</td>
      <td style="text-align:right">${Number(a.count) || 0}</td>
      <td>${esc(new Date(a.lastAt).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }))}</td>
      <td>${a.lastStatus === 200 ? "ok" : esc(String(a.lastStatus))}</td></tr>`)).join("");
  return `${head}
    <div style="overflow-x:auto;margin-top:8px"><table style="width:100%;font-size:11px;border-collapse:collapse">
      <thead><tr style="color:var(--mu);text-align:left"><th>Feed</th><th>Quarto</th><th>Quem</th><th style="text-align:right">Acessos</th><th>Último</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div style="font-size:10px;color:var(--mu);margin-top:6px">Só registra a plataforma, o quarto e a variante do link — nunca o token.</div>`;
}

function setIcalUrl(src, roomId, val) {
  if (!icalUrls[src]) icalUrls[src]={};
  icalUrls[src][roomId]=val;
}

async function saveUrls() {
  const r = await api("POST","/urls", icalUrls);
  const err = apiErrorMessage(r);
  // Antes mostrava "sucesso" mesmo quando o servidor recusava (PMS-012).
  alert(err ? `Não foi possível salvar as URLs: ${err}` : "URLs salvas com sucesso!");
}

async function doCleanup() {
  const btn = document.getElementById("clean-btn");
  if (btn) btn.disabled = true;
  syncLog = ["🧹 Arquivando bloqueios do Airbnb que já terminaram..."];
  render();
  try {
    const data = await api("POST", "/cleanup-blocked");
    if (data.ok) {
      syncLog = [`✅ ${data.cancelled} bloqueio(s) já encerrado(s) marcado(s) como cancelado(s). Nada foi apagado.`];
    } else {
      syncLog = ["✗ Erro: " + (apiErrorMessage(data) || "desconhecido")];
    }
  } catch(e) {
    syncLog = ["✗ Erro: " + e.message];
  }
  if (btn) btn.disabled = false;
  render();
  await loadAll();
}

async function doSync() {
  const btn = document.getElementById("sync-btn");
  if (btn) btn.disabled=true;
  syncLog=["⏳ Sincronizando..."];
  render();
  try {
    const data = await api("POST","/sync");
    syncLog = data.log || ["✅ Concluído"];
  } catch(e) {
    syncLog=["✗ Erro: "+e.message];
  }
  if (btn) btn.disabled=false;
  render();
  await loadAll();
  const lb = document.getElementById("log-box");
  if (lb) lb.scrollTop=lb.scrollHeight;
}

function handleRoomClick(roomId) {
  const st = getRoomStatus(roomId);
  if (st==="cleaning") { openCleaningModal(roomId); return; }
  if (st==="checkin")  { openCheckinModal(roomId);  return; }
  const res = getRoomRes(roomId);
  if (res) openEditModal(res.id);
  else     openNewModal(roomId);
}

// ─── Histórico da reserva (PMS-014) ───────────────────────────────────────────
const AUDIT_ACTIONS = {
  "reserva.criar": "criou a reserva", "reserva.grupo": "criou a reserva do grupo", "reserva.editar": "editou",
  "reserva.cancelar": "cancelou", "reserva.reativar": "reativou", "reserva.apagar": "apagou",
  "pagamento.registrar": "registrou pagamento", "pagamento.receber": "marcou como recebido",
  "pagamento.editar": "alterou pagamento", "pagamento.excluir": "excluiu pagamento",
};
const AUDIT_FIELDS = {
  room_id: "quarto", check_in: "entrada", check_out: "saída", status: "status", source: "canal",
  amount: "valor", payment: "forma", adults: "adultos", children: "crianças",
  kind: "tipo", method: "forma", due_date: "vencimento", paid_at: "pago em", produto: "produto", quartos: "quartos",
};
function auditValue(field, v) {
  if (v === null || v === undefined) return "—";
  if (["amount"].includes(field)) return fmtMoney(v);
  if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v)) return fmtDate(v);
  if (Array.isArray(v)) return v.join(", ");
  return String(v);
}
function describeAuditChanges(ch) {
  const parts = [];
  for (const [k, v] of Object.entries(ch || {})) {
    if (k === "privados") { parts.push(`alterou ${v.join(", ")}`); continue; }
    const label = AUDIT_FIELDS[k] || k;
    if (Array.isArray(v) && v.length === 2 && !["quartos"].includes(k)) parts.push(`${label}: ${auditValue(k, v[0])} → ${auditValue(k, v[1])}`);
    else parts.push(`${label}: ${auditValue(k, v)}`);
  }
  return parts.join(" · ");
}
async function loadHistoryBox(resId) {
  const d = await api("GET", `/reservations/${encodeURIComponent(resId)}/history`);
  const box = document.getElementById("hist-box");
  if (!box || !d || !d.enabled || !Array.isArray(d.items)) return;
  box.innerHTML = renderHistoryBox(d.items);
}
function renderHistoryBox(items) {
  if (!items.length) return `<div style="font-size:11px;color:var(--mu)">🕘 Sem alterações registradas.</div>`;
  return `<details><summary style="cursor:pointer;font-size:13px;font-weight:700">🕘 Histórico (${items.length})</summary>
    <div style="display:flex;flex-direction:column;gap:4px;margin-top:8px">
      ${items.map(it => {
        const when = new Date(it.at);
        const ts = isNaN(when) ? "" : when.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
        return `<div style="font-size:11px;padding:5px 8px;background:var(--bg0);border-radius:6px">
          <b style="color:var(--tx)">${esc(ts)}</b> · ${esc(it.username || "?")} ${esc(AUDIT_ACTIONS[it.action] || it.action)}
          <div style="color:var(--mu)">${esc(describeAuditChanges(it.changes))}</div></div>`;
      }).join("")}
    </div></details>`;
}

const PAY_KINDS = { sinal: "Sinal", parcela: "Parcela", pagamento: "Pagamento", estorno: "Estorno (devolução)" };
const PAY_METHODS = { pix: "PIX", dinheiro: "Dinheiro", cartao: "Cartão", transferencia: "Transferência" };

async function loadPaymentsBox(resId) {

// Receita antiga no caixa ligada a esta reserva (lançada antes dos pagamentos).
// Decisão de 23/11/2026: só avisar, sem converter. Evita contar o valor duas vezes.
function legacyIncomeWarning(li) {
  const box = (msg) => `<div style="font-size:11px;color:#f59e0b;background:#f59e0b14;border:1px solid #f59e0b55;border-radius:8px;padding:8px 10px;margin-bottom:10px;line-height:1.5">${msg}</div>`;
  if (li === null) return box("⚠️ Não foi possível conferir se há receita antiga desta reserva no Financeiro. Confira antes de registrar pagamento.");
  if (!li || !li.count) return "";
  return box(`⚠️ Já existe ${li.count === 1 ? "1 receita lançada" : li.count + " receitas lançadas"} no Financeiro para esta reserva (${fmtMoney(li.total)}), pelo sistema antigo. ` +
    `Não registre aqui o mesmo valor, senão ele conta duas vezes no caixa.`);
}

function renderPaymentsBox(d, resId) {
  const s = d.summary;
  const today = todayStr();
  const methodOpts = Object.entries(PAY_METHODS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  const rows = (d.payments || []).map(p => {
    const paid = !!p.paid_at;
    const late = !paid && p.due_date && p.due_date < today;
    const status = paid ? `✅ pago ${fmtDate(p.paid_at)} · ${PAY_METHODS[p.method] || p.method || ""}`
                        : `${late ? "🔴 vencida" : "🕒 vence"} ${fmtDate(p.due_date)}`;
    return `<div style="display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--bg0);border-radius:8px;flex-wrap:wrap">
      <div style="flex:1;min-width:140px"><b style="color:var(--tx)">${esc(PAY_KINDS[p.kind] || p.kind)}</b>
        <span style="color:${p.kind === "estorno" ? "#ef4444" : "var(--tx)"}"> ${fmtMoney(p.amount)}</span>
        <div style="font-size:10px;color:${late ? "#ef4444" : "var(--mu)"}">${esc(status)}${p.notes ? " · " + esc(p.notes) : ""}</div></div>
      ${paid ? "" : `<select id="pm-${esc(p.id)}" style="font-size:11px">${methodOpts}</select>
        <button class="btn btn-green" style="font-size:11px;padding:4px 8px" onclick="markPaymentPaid('${esc(p.id)}','${esc(resId)}')">Recebido hoje</button>`}
      <button class="btn" style="font-size:11px;padding:4px 8px" title="Excluir" onclick="deletePayment('${esc(p.id)}','${esc(resId)}')">🗑</button>
    </div>`;
  }).join("");
  const kpi = (label, val, color) => `<div style="flex:1;min-width:90px;background:var(--bg0);border-radius:8px;padding:8px;text-align:center">
    <div style="font-size:11px;color:var(--mu)">${label}</div>
    <div style="font-size:14px;font-weight:700;color:${color}">${fmtMoney(val)}</div></div>`;
  return `
    <div style="font-size:13px;color:var(--mu);font-weight:700;margin-bottom:8px">💳 Pagamentos${d.label && d.label !== "" ? " — " + esc(d.label) : ""}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      ${kpi("Contratado", s.contracted, "var(--tx)")}
      ${kpi("Recebido", s.net, "#22c55e")}
      ${kpi("Saldo", s.balance, s.balance > 0 ? "#f59e0b" : "#3b82f6")}
    </div>
    ${legacyIncomeWarning(d.legacyIncome)}
    ${s.contracted === 0 ? `<div style="font-size:11px;color:#f59e0b;margin-bottom:8px">Informe o "Valor Total" da reserva acima e salve para ver o saldo.</div>` : ""}
    ${s.overdue.length ? `<div style="font-size:11px;color:#ef4444;margin-bottom:8px">🔴 ${s.overdue.length} parcela(s) vencida(s)</div>` : ""}
    ${s.unscheduled > 0 && (d.payments || []).length ? `<div style="font-size:11px;color:var(--mu);margin-bottom:8px">Sem parcela cadastrada: ${fmtMoney(s.unscheduled)}</div>` : ""}
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">${rows || `<div style="color:var(--mu)">Nenhum pagamento registrado.</div>`}</div>
    <div style="background:var(--bg0);border-radius:8px;padding:10px">
      <div class="row2">
        <div class="field"><label>Tipo</label><select id="pay-kind">${Object.entries(PAY_KINDS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div>

      </div>

        <div class="field"><label>Observação</label><input id="pay-notes" placeholder="Ex: 2ª parcela do contrato"></div>

async function addPayment(resId) {
  const get = i => document.getElementById(i)?.value || "";
  const scheduled = get("pay-status") === "vence";
  const body = {
    kind: get("pay-kind"), amount: parseFloat(get("pay-amount")), notes: get("pay-notes"),
    ...(scheduled ? { dueDate: get("pay-date") } : { paidAt: get("pay-date"), method: get("pay-method") }),
  };
  const r = await api("POST", `/reservations/${encodeURIComponent(resId)}/payments`, body);
  const err = apiErrorMessage(r);
  if (err) { alert(err); return; }
  await refreshAfterPayment(resId);
}

  const method = document.getElementById("pm-" + payId)?.value || "pix";
  const r = await api("PUT", `/payments/${encodeURIComponent(payId)}`, { paidAt: todayStr(), method });
  const err = apiErrorMessage(r);
  if (err) { alert(err); return; }
  await refreshAfterPayment(resId);
}

async function deletePayment(payId, resId) {
  if (!confirm("Excluir este pagamento? Se ele já foi recebido, sai também do Financeiro.")) return;
  const r = await api("DELETE", `/payments/${encodeURIComponent(payId)}`);
  const err = apiErrorMessage(r);
  if (err) { alert(err); return; }
  await refreshAfterPayment(resId);
}

async function submitCasaToda() {
  const get = i => document.getElementById(i)?.value||"";
  const guestName = get("ct-guestName").trim();
  const checkIn   = get("ct-checkIn");
  const checkOut  = get("ct-checkOut");
  const source    = get("ct-source");
  const adults    = +get("ct-adults")||18;
  const children  = +get("ct-children")||0;
  const phone     = get("ct-phone");
  const notes     = get("ct-notes");

  if (!guestName || !checkIn || !checkOut || checkOut <= checkIn) {
    alert("Preencha nome, check-in e check-out corretamente."); return;
  }
  if (!confirmCapacity("CF", adults, children, null)) return;

  const allRooms = ROOMS.map(r => r.id);
  const clash = localConflict(allRooms, checkIn, checkOut, null);
  if (clash) {
    alert(`⚠️ Conflito de datas!\nQuarto ${clash.roomId} já tem reserva de ${fmtDate(clash.checkIn)} a ${fmtDate(clash.checkOut)}.\nA Casa Fechada não foi criada.`);
    return;
  }

  const groupId = genId();
  const suiteGroupId = genId();

  // Desabilita botão
  const btn = document.querySelector(".modal .btn-green");
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Criando..."; }

  const result = await saveReservationGroup(ROOMS.map(room => ({
    id:        genId(),
    roomId:    room.id,
    guestName,
    checkIn, checkOut, source, phone,
    adults:   Math.round(adults / ROOMS.length),
    children: Math.round(children / ROOMS.length),
    notes:    notes + ` [Casa toda:${groupId}]`
      + (room.id==="11"||room.id==="12" ? ` [Suíte grupo:${suiteGroupId}]` : ""),
    status: "confirmed",
  })));

  await loadAll();
  if (!result.ok) {
    alert(result.error);
    if (btn) { btn.disabled = false; btn.textContent = `🏡 Reservar ${ROOMS.length} Quartos`; }
    return;
  }
  closeModal();
}

    checkIn:   get("f-checkIn"),
    checkOut:  get("f-checkOut"),
    source:    get("f-source"),
    adults:    +get("f-adults")||2,
    children:  +get("f-children")||0,
    phone:     get("f-phone"),
    notes:     get("f-notes"),
    amount:    parseFloat(get("f-amount"))||0,
    payment:   get("f-payment")||"pix",
    status:    "confirmed",
  };
  // Funcionário não vê nem envia valores (o servidor também ignora).
  if (authRole !== "admin") { delete form.amount; delete form.payment; }
  // Edição não mexe no status: antes o formulário mandava sempre "confirmed" e
  // salvar uma correção reativava reserva cancelada ou confirmava pendente.
  // Status muda só pelos botões próprios (ex.: "Cancelar Reserva").
  if (id && reservations.some(r => r.id === id)) delete form.status;
  if (!form.guestName||!form.checkIn||!form.checkOut||form.checkOut<=form.checkIn) {
    alert("Preencha nome, check-in e check-out corretamente."); return;
  }
  const isComposite = form.roomId === "CF" || form.roomId === "11+12";
  if (!confirmCapacity(form.roomId, form.adults, form.children, id ? reservations.find(x => x.id === id) : null)) return;
  if (id && isComposite) {
    alert("Para transformar esta reserva em Casa Fechada ou 11+12, cancele-a e crie uma nova.");
    return;
  }
  const targetRooms = form.roomId === "CF"    ? ROOMS.map(r => r.id)
                    : form.roomId === "11+12" ? ["11","12"]
                    : [form.roomId];

  // Aviso antecipado de conflito, agora também para CF e 11+12 (D4).
  // A garantia real é do servidor; isto só evita uma ida e volta.
  const conflict = localConflict(targetRooms, form.checkIn, form.checkOut, form.id);
  if (conflict) {
    alert(`⚠️ Conflito de datas!\nQuarto ${conflict.roomId} já tem reserva de ${fmtDate(conflict.checkIn)} a ${fmtDate(conflict.checkOut)} (${conflict.guestName}).`);
    return;
  }

  // Auto-save hóspede apenas para reservas diretas (não iCal)
  if (form.source === "direto") {
    await autoSaveGuest(form.guestName, get("f-phone"), get("f-email"));
  }

  // Grava a reserva ANTES de qualquer lançamento financeiro (F1/F4).
  let result, linkId = form.id;
  if (isComposite) {
    const tag = form.roomId === "CF" ? "Casa toda" : "Suíte grupo";
    const groupId = genId();
    result = await saveReservationGroup(targetRooms.map(rid => ({
      ...form,
      id:     genId(),
      roomId: rid,
      notes:  (form.notes||"") + ` [${tag}:${groupId}]`,
    })));
    // O lançamento aponta para a primeira linha criada do grupo (antes apontava
    // para um id que nunca existia).
    if (result.ok) linkId = result.created[0].id;
  } else {
    result = await saveReservation(form);
  }

  if (!result.ok) {
    await loadAll();
    alert(result.error);
    return;
  }

  // PMS-007 ativo: nada de receita automática. Valor contratado não é dinheiro
  // recebido (regra 6); abre a reserva para registrar sinal/parcelas.
  if (paymentsEnabled && form.source === "direto" && !id && authRole === "admin") {
    await loadAll();
    openEditModal(linkId);
    return;
  }
  // Modo antigo (antes da migration): lançamento automático como era.
  if (!paymentsEnabled && form.amount > 0 && form.source === "direto" && !id && authRole === "admin") {
    const tx = await api("POST", "/transactions", {
      id:          genId(),
      type:        "income",
      category:    "reserva_direta",
      description: `Reserva Qto ${form.roomId === "CF" ? "Casa Fechada" : form.roomId} — ${form.guestName}`,
      amount:      form.amount,
      date:        form.checkIn,
      month:       form.checkIn.slice(0,7),
      reservation_id: linkId,
    });
    const txErr = apiErrorMessage(tx);
    if (txErr) alert("Reserva salva, mas o lançamento financeiro falhou: " + txErr +
                     "\nRegistre o valor manualmente no Financeiro.");
    if (finMonth === form.checkIn.slice(0,7)) await loadTransactions(finMonth);
  }

  await loadAll();
  closeModal();
}

// ─── Auto-save hóspede ────────────────────────────────────────────────────────
const GENERIC_NAMES = /^(reserved|blocked|closed|not available|unavailable|bloqueado|airbnb|booking)/i;

// ─── Autocomplete hóspede ─────────────────────────────────────────────────────
function showGuestSuggestions(query) {
  const box = document.getElementById("guest-suggestions");
  if (!box) return;
  const q = query.trim().toLowerCase();
  if (q.length < 2) { box.style.display="none"; return; }
  const matches = guests.filter(g =>
    g.name.toLowerCase().includes(q) ||
    (g.phone||"").includes(q)
  ).slice(0, 6);
  if (!matches.length) { box.style.display="none"; return; }
  box.innerHTML = matches.map(g => `
    <div onmousedown="fillGuestFromSuggestion('${g.id}')"
      style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--bd);
      display:flex;align-items:center;gap:10px"
      onmouseover="this.style.background='var(--bg3)'"
      onmouseout="this.style.background=''">
      <span style="font-size:16px">👤</span>
      <div>
        <div style="font-size:13px;font-weight:600">${esc(g.name)}</div>
        <div style="font-size:10px;color:var(--mu)">${esc(g.phone||"")}${g.phone&&g.email?" · ":""}${esc(g.email||"")}</div>
      </div>
    </div>`).join("");
  box.style.display = "block";
}

function hideGuestSuggestions() {
  const box = document.getElementById("guest-suggestions");
  if (box) box.style.display = "none";
}

function fillGuestFromSuggestion(guestId) {
  const g = guests.find(x => x.id === guestId);
  if (!g) return;
  const nameEl  = document.getElementById("f-guestName");
  const phoneEl = document.getElementById("f-phone");
  const emailEl = document.getElementById("f-email");
  if (nameEl)  nameEl.value  = g.name;
  if (phoneEl) phoneEl.value = g.phone  || "";
  if (emailEl) emailEl.value = g.email  || "";
  hideGuestSuggestions();
}
async function autoSaveGuest(name, phone, email) {
  if (!name || GENERIC_NAMES.test(name.trim())) return;
  // Procura por nome exato ou telefone
  const existing = guests.find(g =>
    g.name === name || (phone && g.phone === phone)
  );
  if (existing) {
    // Atualiza phone/email se vieram preenchidos e estavam vazios
    const needsUpdate =
      (phone && !existing.phone) || (email && !existing.email);
    if (needsUpdate) {
      await api("PUT", "/guests/"+existing.id, {
        ...existing,
        phone: phone || existing.phone,
        email: email || existing.email,
      });
    }
  } else {
    // Cadastra novo hóspede
    await api("POST", "/guests", {
      id:    genId(),
      name, phone: phone||"", email: email||"",
      cpf:"", address:"", notes:"",
    });
  }
}

// ─── Init ─────────────────────────────────────────────────────────────────────
// Se já tem token salvo, tenta carregar direto; senão mostra login
let autoRefreshInterval = null;

function startAutoRefresh() {
  if (autoRefreshInterval) clearInterval(autoRefreshInterval);
  autoRefreshInterval = setInterval(loadAll, 5 * 60 * 1000);
}

function stopAutoRefresh() {
  if (autoRefreshInterval) { clearInterval(autoRefreshInterval); autoRefreshInterval = null; }
}

// Ao voltar para o app (iPhone em segundo plano, troca de aba), recarrega os dados
// em vez de mostrar a tela de até 5 minutos atrás. Intervalo mínimo de 30 s.
let lastVisibleRefresh = 0;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !authToken) return;
  const now = Date.now();
  if (now - lastVisibleRefresh < 30 * 1000) return;
  lastVisibleRefresh = now;
  loadAll();
});
if (authToken) {
  applyRole();
  loadAll().catch(() => { clearAuth(); showLoginScreen(); });
  startAutoRefresh();
} else {
  showLoginScreen();
}

</script>
