<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PMS · Pousada</title>
<!-- Instalação na tela de início (iPhone/Android). Sem service worker: nenhum dado fica em cache offline. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0d1221">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pousada">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo">🏡</div>
    <h2>PMS Pousada</h2>
    <div class="sub">Faça login para continuar</div>
    <input type="text" id="l-user" placeholder="Usuário" autocomplete="username"
      onkeydown="if(event.key==='Enter')doLogin()">
    <input type="password" id="l-pass" placeholder="Senha" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()">
    <div class="err" id="l-err"></div>
    <button class="btn btn-green" style="width:100%;padding:13px;font-size:15px" onclick="doLogin()">
      Entrar
    </button>
  </div>
</div>

<div id="sidebar">
  <div class="logo">🏡</div>
  <div class="nav-group">Dia a dia</div>
  <button class="nav-btn active" onclick="showView('map')" title="Mapa de quartos" data-view="map"><span class="ico">🏨</span><span class="lbl">Mapa</span></button>
  <button class="nav-btn" onclick="showView('reservas')" title="Reservas" data-view="reservas"><span class="ico">📋</span><span class="lbl">Reservas</span></button>
  <button class="nav-btn" onclick="showView('calendario')" title="Calendário de ocupação" data-view="calendario"><span class="ico">🗓️</span><span class="lbl">Calendário</span></button>
  <button class="nav-btn" onclick="showView('hospedes')" title="Hóspedes" data-view="hospedes"><span class="ico">👥</span><span class="lbl">Hóspedes</span></button>
  <div class="nav-group admin-only">Dinheiro</div>
  <button class="nav-btn nav-extra admin-only" onclick="showView('financeiro')" title="Financeiro" data-view="financeiro" data-group="Dinheiro"><span class="ico">💰</span><span class="lbl">Financeiro</span></button>
  <button class="nav-btn nav-extra admin-only" onclick="showView('relatorios')" title="Relatórios" data-view="relatorios" data-group="Dinheiro"><span class="ico">📈</span><span class="lbl">Relatórios</span></button>
  <div class="nav-group admin-only">Canais</div>
  <button class="nav-btn nav-extra admin-only" onclick="showView('alertas')" title="Alertas de overbooking" data-view="alertas" data-group="Canais"><span class="ico">⚠️</span><span class="lbl">Alertas</span><span class="dot"></span></button>
  <button class="nav-btn nav-extra admin-only" onclick="showView('prereservas')" title="Pré-reservas e contatos" data-view="prereservas" data-group="Canais"><span class="ico">📝</span><span class="lbl">Pré-reservas</span></button>
  <button class="nav-btn nav-extra admin-only" onclick="showView('calendarios')" title="Links iCal para Booking e Airbnb" data-view="calendarios" data-group="Canais"><span class="ico">📅</span><span class="lbl">Links iCal</span></button>
  <button class="nav-btn nav-extra admin-only" onclick="showView('sync')" title="Sincronizar com Booking e Airbnb" data-view="sync" data-group="Canais"><span class="ico">🔄</span><span class="lbl">Sincronizar</span></button>
  <button class="nav-btn nav-more" onclick="openMoreMenu()" title="Mais opções" id="nav-more-btn"><span class="ico">☰</span><span class="lbl">Mais</span><span class="dot"></span></button>
  <div style="flex:1"></div>
  <button class="nav-btn" onclick="showUserMenu()" title="Minha conta" id="user-nav-btn"><span class="ico">👤</span><span class="lbl">Conta</span></button>
</div>

<div id="main">
  <div id="topbar">
    <div>
      <h1 id="view-title">Mapa de Quartos</h1>
      <div class="sub" id="today-label"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-green" onclick="openNewModal()">+ Nova Reserva</button>
    </div>
  </div>
  <div id="load-banner" role="alert" style="display:none;background:#2b0f0f;border-bottom:1px solid #ef444466;color:#fecaca;padding:10px 16px;font-size:12px;line-height:1.5"></div>
  <div id="content"></div>
</div>

<!-- Modal -->
<div class="overlay" id="modal" style="display:none" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h2 id="modal-title">Nova Reserva <button onclick="closeModal()">×</button></h2>
    <div id="modal-body"></div>
  </div>
</div>

<script src="js/01-base-estado-api.js"></script>
<script src="js/02-quartos-render-menu.js"></script>
<script src="js/03-avisos-backup.js"></script>
<script src="js/04-calendario.js"></script>
<script src="js/05-relatorios.js"></script>
<script src="js/06-mapa.js"></script>
<script src="js/07-reservas.js"></script>
<script src="js/08-hospedes.js"></script>
<script src="js/09-financeiro.js"></script>
<script src="js/10-alertas.js"></script>
<script src="js/11-prereservas.js"></script>
<script src="js/12-sincronizar.js"></script>
<script src="js/13-modais-pagamentos.js"></script>
<script src="js/14-hospede-autocompletar.js"></script>
<script src="js/15-inicio.js"></script>
</body>
</html>
