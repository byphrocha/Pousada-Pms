<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMS · Pousada</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#070b14;--bg1:#0d1221;--bg2:#131929;--bg3:#1b2234;
  --bd:#1e2d45;--bdh:#2d4268;
  --tx:#d9e4f5;--mu:#5a7090;--dm:#8898b4;
  --gr:#22c55e;--grd:#0f2b1a;
  --rd:#ef4444;--rdd:#2b0f0f;
  --bl:#3b82f6;--bld:#0f1e2b;
  --am:#f59e0b;--amd:#2b1e0a;
  --lp:#a855f7;--lpd:#1e0f2b;
  --bk:#0066cc;--ab:#ff5a5f;--di:#8b5cf6;
}
body{background:var(--bg0);color:var(--tx);font-family:'DM Mono',monospace;min-height:100vh;display:flex}
button{font-family:'DM Mono',monospace;cursor:pointer}
input,select,textarea{font-family:'DM Mono',monospace}

/* Layout */
#sidebar{width:64px;background:var(--bg1);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:4px;flex-shrink:0}
#sidebar .logo{font-size:24px;margin-bottom:16px}
.nav-btn{width:48px;height:48px;border-radius:10px;border:none;background:transparent;font-size:20px;color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;border-left:3px solid transparent;transition:all .15s}
.nav-btn.active{background:var(--bg3);border-left-color:var(--bl)}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:var(--bg1);border-bottom:1px solid var(--bd);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#topbar h1{font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--tx)}
#topbar .sub{font-size:10px;color:var(--mu);margin-top:2px;letter-spacing:.04em}
#content{flex:1;overflow-y:auto;padding:24px}

/* Cards */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.kpi{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;text-align:center}
.kpi .val{font-size:28px;font-weight:700;font-family:'Fraunces',serif;line-height:1}
.kpi .lbl{font-size:9px;color:var(--mu);margin-top:4px;letter-spacing:.1em}

/* Room grid */
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.room-card{border-radius:12px;padding:12px 8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;transition:transform .18s,box-shadow .18s;user-select:none}
.room-card:hover{transform:translateY(-3px)}
.room-dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%}
.room-num{font-size:20px;font-weight:700;line-height:1}
.room-icon{font-size:24px}
.room-type{font-size:9px;text-align:center;line-height:1.3;font-weight:600;max-width:80px}
.room-climate{font-size:9px;background:rgba(255,255,255,.07);padding:2px 7px;border-radius:99px}
.clean-btn{margin-top:4px;font-size:9px;padding:3px 8px;border-radius:6px;border:1px solid #a855f7;background:#1e0f2b;color:#a855f7;cursor:pointer;font-family:'DM Mono',monospace;font-weight:700;transition:background .15s}
.clean-btn:hover{background:#2d1545}

/* Legend */
.legend{display:flex;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mu)}
.legend-dot{width:8px;height:8px;border-radius:50%}

/* Reservas list */
.res-row{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:14px;margin-bottom:8px;transition:border-color .15s}
.res-row:hover{border-color:var(--bdh)}
.res-id{width:46px;height:46px;border-radius:10px;background:var(--bg0);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--bl);flex-shrink:0}
.pill{font-size:10px;padding:2px 9px;border-radius:99px;font-weight:700;letter-spacing:.04em}

/* Date group header */
.date-group-header{display:flex;align-items:center;gap:12px;margin:20px 0 10px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--mu);text-transform:uppercase}
.date-group-header:first-child{margin-top:0}
.date-group-line{flex:1;height:1px;background:var(--bd)}
.date-group-badge{background:var(--bg2);border:1px solid var(--bd);border-radius:6px;padding:3px 10px;white-space:nowrap;font-size:10px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--bg1);border:1px solid var(--bd);border-radius:16px;padding:28px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.modal h2{font-family:'Fraunces',serif;font-size:17px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center}
.modal h2 button{background:none;border:none;color:var(--mu);font-size:24px;cursor:pointer;padding:0 4px}

/* Form */
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;color:var(--mu);margin-bottom:4px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.field input,.field select,.field textarea{width:100%;background:var(--bg0);border:1px solid var(--bd);border-radius:8px;color:var(--tx);padding:9px 12px;font-size:13px;outline:none;font-family:'DM Mono',monospace}
.field textarea{height:64px;resize:vertical}
.row2{display:flex;gap:12px}
.row2 .field{flex:1}

/* Buttons */
.btn{border-radius:8px;padding:9px 18px;font-size:13px;font-weight:600;border:1px solid var(--bd);color:#fff;font-family:'DM Mono',monospace;cursor:pointer;transition:opacity .15s}
.btn-green{background:#166534;border-color:#166534}
.btn-blue{background:#1e3a5f;border-color:var(--bl);color:var(--bl)}
.btn-red{background:#4a1010;border-color:var(--rd)}
.btn-purple{background:#2d1545;border-color:var(--lp);color:var(--lp)}
.btn-dim{background:var(--bg3)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Filter bar */
.filter-bar{display:flex;gap:10px;margin-bottom:18px;align-items:center;flex-wrap:wrap}
.filter-bar input{background:var(--bg0);border:1px solid var(--bd);border-radius:8px;color:var(--tx);padding:8px 12px;font-size:13px;outline:none;width:220px;font-family:'DM Mono',monospace}
.tab-btn{padding:8px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--bg2);color:var(--mu);cursor:pointer;font-size:11px;font-weight:700;font-family:'DM Mono',monospace}
.tab-btn.active{background:#1e3a5f;border-color:var(--bl);color:var(--bl)}

/* Date filter */
.date-filter{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.date-filter label{font-size:10px;color:var(--mu);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.date-filter input[type=date]{background:var(--bg0);border:1px solid var(--bd);border-radius:8px;color:var(--tx);padding:7px 10px;font-size:12px;outline:none;font-family:'DM Mono',monospace}
.date-filter .clear-btn{font-size:11px;padding:7px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg2);color:var(--mu);cursor:pointer;font-family:'DM Mono',monospace}

/* Sync */
.log-box{background:#04060d;border:1px solid var(--bd);border-radius:10px;padding:16px;font-family:'DM Mono',monospace;font-size:11px;color:#4ade80;max-height:200px;overflow-y:auto;line-height:1.8;margin-top:16px}
.sync-info{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:20px;font-size:13px;color:var(--dm);line-height:1.7}

/* Today agenda */
.agenda{margin-top:28px;border-top:1px solid var(--bd);padding-top:22px}
.agenda-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.agenda-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;margin-bottom:8px}
.agenda-row{border-radius:8px;padding:9px 12px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:10px}
.agenda-room{font-weight:800;font-size:15px}

/* Suite */
.suite-wrapper{display:contents}
.suite-group{grid-column:span 2;display:flex;flex-direction:column;gap:4px;
  border:2px dashed #f59e0b55;border-radius:14px;padding:8px;position:relative;background:#2b1e0a22}
.suite-label{font-size:9px;color:#f59e0b;font-weight:700;letter-spacing:.1em;text-align:center;
  margin-bottom:2px;text-transform:uppercase}
.suite-rooms{display:flex;gap:8px}
.suite-rooms .room-card{flex:1}
.suite-join-btn{font-size:10px;padding:5px 10px;border-radius:7px;border:1px solid #f59e0b;
  background:#2b1e0a;color:#f59e0b;cursor:pointer;font-family:'DM Mono',monospace;
  font-weight:700;text-align:center;margin-top:2px;transition:background .15s;width:100%}
.suite-join-btn:hover{background:#3d2a0f}

@media(max-width:640px){
  /* Layout: sidebar vira bottom nav */
  body{flex-direction:column}
  #sidebar{
    width:100%; height:58px; flex-direction:row;
    border-right:none; border-top:1px solid var(--bd);
    padding:0 8px; gap:0;
    order:2; position:fixed; bottom:0; left:0; right:0; z-index:100;
    justify-content:space-around;
  }
  #sidebar .logo{display:none}
  .nav-btn{
    border-left:none; border-top:3px solid transparent;
    border-radius:8px; flex:1; height:48px;
    flex-direction:column; font-size:18px; gap:2px;
  }
  .nav-btn.active{border-top-color:var(--bl);background:var(--bg3)}
  #main{order:1; overflow:hidden; padding-bottom:58px}
  #topbar{padding:10px 14px}
  #topbar h1{font-size:15px}
  #topbar .sub{display:none}
  #topbar .btn{font-size:11px;padding:7px 12px}
  #content{padding:14px}

  /* KPIs: 3 por linha */
  .kpi-grid{grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .kpi .val{font-size:22px}
  .kpi .lbl{font-size:8px}

  /* Room grid: menor */
  .room-grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
  .room-card{padding:10px 6px 8px}
  .room-num{font-size:17px}
  .room-icon{font-size:20px}

  /* Suite */
  .suite-group{grid-column:span 2}

  /* Agenda */
  .agenda-grid{grid-template-columns:1fr}
  .agenda{margin-top:18px;padding-top:14px}

  /* Reservas */
  .filter-bar{gap:7px}
  .filter-bar input{width:100%;order:-1}
  .filter-bar>div{overflow-x:auto;-webkit-overflow-scrolling:touch;
    display:flex;gap:6px;padding-bottom:2px;max-width:100%}
  .filter-bar>div::-webkit-scrollbar{display:none}
  .tab-btn{white-space:nowrap;font-size:10px;padding:7px 10px}
  .filter-bar .btn{white-space:nowrap}

  .date-filter{gap:6px}
  .date-filter>div:last-child{margin-left:0;width:100%;justify-content:flex-end}

  /* Res row compacto */
  .res-row{padding:10px 12px;gap:10px}
  .res-id{width:38px;height:38px;font-size:14px}

  /* Modal: full screen no mobile */
  .overlay{padding:0;align-items:flex-end}
  .modal{border-radius:16px 16px 0 0;max-height:88vh;padding:20px 16px}

  /* Legend scroll horizontal */
  .legend{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .legend::-webkit-scrollbar{display:none}
}

/* ─── Financeiro ─────────────────────────────────────────────────────────── */
@media(max-width:640px){
  .fin-lists{grid-template-columns:1fr !important}
}
/* ─── Login ───────────────────────────────────────────────────────────────── */
#login-screen{position:fixed;inset:0;background:var(--bg0);display:flex;align-items:center;
  justify-content:center;z-index:9999}
#login-screen.hidden{display:none}
.login-box{background:var(--bg1);border:1px solid var(--bd);border-radius:20px;
  padding:40px 36px;width:100%;max-width:360px;text-align:center}
.login-box .logo{font-size:48px;margin-bottom:8px}
.login-box h2{font-size:20px;font-weight:700;margin-bottom:4px}
.login-box .sub{font-size:12px;color:var(--mu);margin-bottom:28px}
.login-box input{width:100%;background:var(--bg0);border:1px solid var(--bd);border-radius:10px;
  padding:12px 14px;color:var(--tx);font-size:14px;margin-bottom:12px;outline:none;box-sizing:border-box}
.login-box input:focus{border-color:var(--bl)}
.login-box .err{color:#ef4444;font-size:12px;margin-bottom:10px;min-height:18px}
.user-badge{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu);cursor:pointer}
.user-badge:hover{color:var(--tx)}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo">🏡</div>
    <h2>PMS Pousada</h2>
    <div class="sub">Faça login para continuar</div>
    <input type="text" id="l-user" placeholder="Usuário" autocomplete="username"
      onkeydown="if(event.key==='Enter')doLogin()">
    <input type="password" id="l-pass" placeholder="Senha" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()">
    <div class="err" id="l-err"></div>
    <button class="btn btn-green" style="width:100%;padding:13px;font-size:15px" onclick="doLogin()">
      Entrar
    </button>
  </div>
</div>

<div id="sidebar">
  <div class="logo">🏡</div>
  <button class="nav-btn active" onclick="showView('map')" title="Mapa de Quartos" data-view="map">🏨</button>
  <button class="nav-btn" onclick="showView('reservas')" title="Reservas" data-view="reservas">📋</button>
  <button class="nav-btn" onclick="showView('hospedes')" title="Hóspedes" data-view="hospedes">👥</button>
  <button class="nav-btn admin-only" onclick="showView('financeiro')" title="Financeiro" data-view="financeiro">💰</button>
  <button class="nav-btn admin-only" onclick="showView('alertas')" title="Alertas de Overbooking" data-view="alertas">⚠️</button>
  <button class="nav-btn admin-only" onclick="showView('prereservas')" title="Pré-reservas / Leads" data-view="prereservas">📝</button>
  <button class="nav-btn admin-only" onclick="showView('sync')" title="Sincronizar iCal" data-view="sync">🔄</button>
  <div style="flex:1"></div>
  <button class="nav-btn" onclick="showUserMenu()" title="Minha conta" id="user-nav-btn" style="font-size:14px">👤</button>
</div>

<div id="main">
  <div id="topbar">
    <div>
      <h1 id="view-title">Mapa de Quartos</h1>
      <div class="sub" id="today-label"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-green" onclick="openNewModal()">+ Nova Reserva</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<!-- Modal -->
<div class="overlay" id="modal" style="display:none" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h2 id="modal-title">Nova Reserva <button onclick="closeModal()">×</button></h2>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ─── Sanitização XSS ──────────────────────────────────────────────────────────
// SEMPRE use esc() ao inserir dados do usuário em innerHTML
function esc(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/\x3c/g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}


const ROOMS = [
  {id:"10",type:"Triplo",climate:"AC",cap:3},
  {id:"11",type:"Triplo",climate:"Ventilador",cap:3},
  {id:"12",type:"Triplo",climate:"Ventilador",cap:3},
  {id:"20",type:"Quádruplo",climate:"AC",cap:4},
  {id:"21",type:"Triplo",climate:"AC",cap:3},
  {id:"22",type:"Casal+1 Soltr",climate:"AC",cap:3},
  {id:"23",type:"Casal+2 Soltr",climate:"AC",cap:4},
  {id:"24",type:"Duplo",climate:"AC",cap:2},
  {id:"25",type:"Casal+1 Soltr",climate:"AC",cap:3},
];

// ─── Suítes (quartos combinados) ─────────────────────────────────────────────
const SUITES = [
  { id:"11+12", label:"Suíte 11+12", rooms:["11","12"], type:"Triplo ×2 (Ventilador)", cap:6 }
];
const todayStr  = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
};
const fmtDate   = s => s ? new Date(s+"T12:00:00").toLocaleDateString("pt-BR") : "—";
const fmtMonth  = s => s ? new Date(s+"T12:00:00").toLocaleDateString("pt-BR",{month:"long",year:"numeric"}) : "";
const genId     = () => Math.random().toString(36).slice(2,10);
const nights    = (ci,co) => Math.max(0,Math.round((new Date(co)-new Date(ci))/86400000));
const isSameDay = (a,b) => a===b;

// ─── State ────────────────────────────────────────────────────────────────────
let reservations = [];
let guests        = [];
let guestSearch   = "";
let transactions  = [];
let finMonth      = todayStr().slice(0,7); // YYYY-MM
let currentView  = "map";
let syncLog      = [];
let icalUrls     = {booking:{},airbnb:{}};
let filterTab    = "upcoming";
let searchQ      = "";
let dateFrom     = "";
let dateTo       = "";
let groupByDate  = true;          // agrupamento por data nas reservas
let prereservations = [];


let checkedInRooms = new Set();   // quartos com check-in confirmado hoje

async function saveRoomStates() {
  try {
    await api("POST", "/room-states", {
      cleaned:   [...cleanedRooms],
      checkedIn: [...checkedInRooms],
    });
  } catch(e) { console.error("saveRoomStates:", e); }
}

async function loadRoomStates() {
  try {
    const data = await api("GET", "/room-states");
    cleanedRooms   = new Set(data.cleaned   || []);
    checkedInRooms = new Set(data.checkedIn || []);
  } catch(e) { console.error("loadRoomStates:", e); }
}

// saveClean/saveCheckedIn agora salvam no servidor (sincroniza entre dispositivos)
function saveClean()     { saveRoomStates(); }
function saveCheckedIn() { saveRoomStates(); }

// ─── Auth state ──────────────────────────────────────────────────────────────
let authToken    = localStorage.getItem("pms_token") || "";
let authRole     = localStorage.getItem("pms_role")  || "";
let authUsername = localStorage.getItem("pms_user")  || "";

function setAuth(token, role, username) {
  authToken = token; authRole = role; authUsername = username;
  localStorage.setItem("pms_token",   token);
  localStorage.setItem("pms_role",    role);
  localStorage.setItem("pms_user",    username);
}
function clearAuth() {
  authToken = ""; authRole = ""; authUsername = "";
  localStorage.removeItem("pms_token");
  localStorage.removeItem("pms_role");
  localStorage.removeItem("pms_user");
}

// ─── API ──────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {method, headers:{"Content-Type":"application/json",
    ...(authToken ? {"Authorization":"Bearer "+authToken} : {})}};
  if (body) opts.body = JSON.stringify(body);
  try {
    const r = await fetch(path, opts);
    if (r.status === 401) { clearAuth(); showLoginScreen(); return {}; }
    return r.json();
  } catch(e) {
    console.error("api error:", e);
    return { _networkError: true, error: "Erro de conexão" };
  }
}

async function doLogin() {
  const username = document.getElementById("l-user")?.value.trim();
  const password = document.getElementById("l-pass")?.value;
  const errEl = document.getElementById("l-err");
  errEl.textContent = "";
  try {
    const res = await fetch("/login", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || "Erro ao entrar"; return; }
    setAuth(data.token, data.role, data.username);
    hideLoginScreen();
    applyRole();
    await loadAll();
    startAutoRefresh();
    render();
  } catch(e) { errEl.textContent = "Erro de conexão"; }
}

function showLoginScreen() {
  document.getElementById("login-screen").classList.remove("hidden");
}
function hideLoginScreen() {
  document.getElementById("login-screen").classList.add("hidden");
}

function applyRole() {
  // Esconde itens admin-only para staff
  document.querySelectorAll(".admin-only").forEach(el => {
    el.style.display = authRole === "admin" ? "" : "none";
  });
  // Se estava na view de sync e é staff, volta pro mapa
  if (authRole !== "admin" && (currentView === "sync" || currentView === "alertas" || currentView === "prereservas")) {
    currentView = "map";
  }
  // Atualiza tooltip do botão de usuário
  const btn = document.getElementById("user-nav-btn");
  if (btn) btn.title = authUsername + " — clique para sair";
}

function showUserMenu() {
  const isAdmin = authRole === "admin";
  document.getElementById("modal-title").innerHTML =
    `👤 Minha conta <button onclick="closeModal()">×</button>`;
  document.getElementById("modal-body").innerHTML = `
    <div style="margin-bottom:20px">
      <div style="font-size:15px;font-weight:700">${authUsername}</div>
      <div style="font-size:12px;color:var(--mu);margin-top:4px">
        ${isAdmin ? "👑 Administrador" : "👥 Funcionário"}
      </div>
    </div>
    ${isAdmin ? `
    <div style="margin-bottom:24px">
      <div style="font-size:11px;color:var(--mu);font-weight:700;letter-spacing:.1em;margin-bottom:12px">
        ALTERAR SENHA
      </div>

async function doChangePassword() {
  const cur  = document.getElementById("cp-cur")?.value;
  const nw   = document.getElementById("cp-new")?.value;
  const nw2  = document.getElementById("cp-new2")?.value;
  if (!cur || !nw) { alert("Preencha todos os campos"); return; }
  if (nw !== nw2)  { alert("As senhas não coincidem"); return; }
  if (nw.length < 6) { alert("Senha deve ter ao menos 6 caracteres"); return; }
  const res = await api("POST", "/change-password", {currentPassword:cur, newPassword:nw});
  if (res.ok) { alert("Senha alterada com sucesso!"); closeModal(); }
  else alert(res.error || "Erro ao alterar senha");
}

const BLOCKED_NAMES = [
  /not available/i, /closed/i, /blocked/i,
  /bloqueado/i, /indispon/i, /unavailable/i,
];
// Só filtra bloqueios do Airbnb — no Booking "Closed" pode ser reserva real
const isAirbnbBlock = r => r.source === "airbnb" && BLOCKED_NAMES.some(p => p.test(r.guestName||""));

async function loadAll() {
  try {
    const promises = [
      api("GET","/reservations"),
      api("GET","/guests"),
      api("GET","/room-states"),
      authRole === "admin" ? api("GET","/urls") : Promise.resolve(null),
      authRole === "admin" ? api("GET","/transactions?month="+finMonth) : Promise.resolve(null),
      authRole === "admin" ? api("GET","/prereservations") : Promise.resolve(null),
    ];
    const [res, gsts, states, urls, txns, preresvs] = await Promise.all(promises);
    reservations = Array.isArray(res)
      ? res.map(normalizeRes).filter(r => !isAirbnbBlock(r))
      : [];
    guests        = Array.isArray(gsts) ? gsts : [];
    cleanedRooms   = new Set(states?.cleaned   || []);
    checkedInRooms = new Set(states?.checkedIn || []);
    if (urls)     icalUrls      = urls;
    if (txns)     transactions  = Array.isArray(txns)     ? txns     : [];
    if (preresvs) prereservations = Array.isArray(preresvs) ? preresvs : [];
  } catch(e) { console.error(e); }
  render();
}

function normalizeRes(r) {
  return {
    id:          r.id,
    roomId:      r.room_id    || r.roomId,
    guestName:   r.guest_name || r.guestName,
    checkIn:     r.check_in   || r.checkIn,
    checkOut:    r.check_out  || r.checkOut,
    source:      r.source     || "direto",
    adults:      r.adults     || 2,
    children:    r.children   || 0,
    phone:       r.phone      || "",
    notes:       r.notes      || "",
    status:      r.status     || "confirmed",
    externalUid: r.external_uid || r.externalUid || null,
    createdAt:   r.created_at   || r.createdAt   || new Date().toISOString(),
    amount:      r.amount   || 0,
    payment:     r.payment  || "pix",
  };
}

async function saveReservation(form) {
  const isExisting = form.id && reservations.find(r=>r.id===form.id);
  if (isExisting) {
    await api("PUT",`/reservations/${form.id}`, form);
    // Se editou valor em reserva direta, cria/atualiza transação
    if (form.amount > 0 && form.source === "direto" && authRole === "admin") {
      // Verifica se já existe transação vinculada
      const existing = transactions.find(t => t.reservation_id === form.id);
      if (existing) {
        // Atualiza valor
        await api("PUT", "/transactions/"+existing.id, {
          ...existing,
          amount: form.amount,
          description: `Reserva Qto ${form.roomId} — ${form.guestName}`,
        });
      } else {
        // Cria nova transação
        await api("POST", "/transactions", {
          id:             genId(),
          type:           "income",
          category:       "reserva_direta",
          description:    `Reserva Qto ${form.roomId} — ${form.guestName}`,
          amount:         form.amount,
          date:           form.checkIn,
          month:          form.checkIn.slice(0,7),
          reservation_id: form.id,
        });
      }
      if (finMonth === form.checkIn.slice(0,7)) await loadTransactions(finMonth);
    }
  } else {
    const res = await api("POST","/reservations", {...form, id:genId()});
    if (res.reservation) reservations.push(normalizeRes(res.reservation));
  }
  await loadAll();
}

async function cancelReservation(id) {
  if (!confirm("Cancelar esta reserva? Esta ação não pode ser desfeita.")) return;
  await api("PUT",`/reservations/${id}`, {status:"cancelled"});
  await loadAll();
  closeModal();
}

// ─── Room helpers ─────────────────────────────────────────────────────────────
function getRoomStatus(roomId) {
  const t = todayStr();
  const hasCheckoutToday = reservations.some(r=>
    r.roomId===roomId && r.status!=="cancelled" && r.checkOut===t
  );
  const hasCheckinToday = reservations.some(r=>
    r.roomId===roomId && r.status!=="cancelled" && r.checkIn===t
  );

  // Se tem checkout hoje e ainda não limpou → roxo (limpeza obrigatória antes do próximo check-in)
  if (hasCheckoutToday && !cleanedRooms.has(roomId)) return "cleaning";

  // Quarto limpo (ou sem checkout hoje) — verifica check-in
  if (hasCheckinToday) {
    if (checkedInRooms.has(roomId)) return "occupied"; // check-in confirmado → vermelho
    return "checkin";                                   // check-in pendente → azul
  }

  // Ocupado (hóspede já dentro, sem movimento hoje)
  const isOccupied = reservations.some(r=>
    r.roomId===roomId && r.status!=="cancelled" && r.checkIn<t && r.checkOut>t
  );
  if (isOccupied) return "occupied";

  return "free";
}

function getRoomRes(roomId) {
  const t = todayStr();
  return reservations.find(r=>
    r.roomId===roomId && r.status!=="cancelled" && r.checkIn<=t && r.checkOut>t
  );
}

function markCheckedIn(roomId, event) {
  if (event) event.stopPropagation();
  checkedInRooms.add(roomId);
  saveCheckedIn();
  render();
}

function markClean(roomId, event) {
  event.stopPropagation();
  cleanedRooms.add(roomId);
  saveClean();
  render();
}

// ─── Render engine ────────────────────────────────────────────────────────────
function render() {
  const titles = {map:"Mapa de Quartos", reservas:"Reservas",
    hospedes:"Hóspedes", financeiro:"Financeiro",
    alertas:"⚠️ Alertas de Overbooking", prereservas:"📝 Pré-reservas & Leads",
    sync:"Sincronizar iCal"};
  document.getElementById("view-title").textContent  = titles[currentView] || "";

    new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  document.querySelectorAll(".nav-btn[data-view]").forEach(b=>{
    b.classList.toggle("active", b.dataset.view===currentView);
  });
  const el = document.getElementById("content");
  if (currentView==="map")         el.innerHTML = renderMap();
  if (currentView==="reservas")    el.innerHTML = renderReservas();
  if (currentView==="hospedes")    el.innerHTML = renderHospedes();
  if (currentView==="financeiro")  el.innerHTML = renderFinanceiro();
  if (currentView==="alertas")     el.innerHTML = renderAlertas();
  if (currentView==="prereservas") el.innerHTML = renderPreReservas();
  if (currentView==="sync")        el.innerHTML = renderSync();

  // Badge de alerta no botão ⚠️
  if (authRole === "admin") {
    const confirmed = reservations.filter(r => r.status !== "cancelled");
    let alertCount = 0;
    for (let i = 0; i < confirmed.length; i++)
      for (let j = i+1; j < confirmed.length; j++) {
        const a = confirmed[i], b = confirmed[j];
        if (a.roomId === b.roomId && a.checkIn < b.checkOut && b.checkIn < a.checkOut) alertCount++;
      }
    const alertBtn = document.querySelector('.nav-btn[data-view="alertas"]');
    if (alertBtn) alertBtn.innerHTML = alertCount > 0
      ? `⚠️<span style="position:absolute;top:4px;right:4px;width:8px;height:8px;background:#ef4444;border-radius:50%"></span>`
      : "⚠️";
    if (alertBtn) alertBtn.style.position = "relative";
  }
}

function getCasaFechadaToday() {
  const t = todayStr();
  // reserva de casa fechada ativa hoje (qualquer quarto com nota [Casa toda:])
  return reservations.find(r =>
    r.status !== "cancelled" &&
    r.notes && r.notes.includes("[Casa toda:") &&
    r.checkIn <= t && r.checkOut > t
  ) || null;
}
function getCasaFechadaCheckin() {
  const t = todayStr();
  return reservations.find(r =>
    r.status !== "cancelled" &&
    r.notes && r.notes.includes("[Casa toda:") &&
    r.checkIn === t
  ) || null;
}
function getCasaFechadaCheckout() {
  const t = todayStr();
  return reservations.find(r =>
    r.status !== "cancelled" &&
    r.notes && r.notes.includes("[Casa toda:") &&
    r.checkOut === t
  ) || null;
}

function renderMap() {
  const t        = todayStr();

  const cfCheckin  = getCasaFechadaCheckin();

  // Se há Casa Fechada, todos os quartos são contados como ocupados
  const occupied = cfAtiva
    ? ROOMS.map(r => ({roomId: r.id}))  // virtual: todos ocupados
    : reservations.filter(r=>r.status!=="cancelled"&&r.checkIn<=t&&r.checkOut>t);

  // Check-ins e check-outs: se CF, mostra 1 (a pousada toda)
  const checkins  = cfCheckin  ? [{roomId:"CF"}]
    : reservations.filter(r=>r.checkIn===t&&r.status!=="cancelled"&&!(r.notes&&r.notes.includes("[Casa toda:")));
  const checkouts = cfCheckout ? [{roomId:"CF"}]
    : reservations.filter(r=>r.checkOut===t&&r.status!=="cancelled"&&!(r.notes&&r.notes.includes("[Casa toda:")));
  const cleaning  = cfAtiva ? [] : ROOMS.filter(r=>getRoomStatus(r.id)==="cleaning");

  // KPIs
  let html = `<div class="kpi-grid">`;
  [
    [cfAtiva ? ROOMS.length : occupied.length, "#ef4444","Ocupados"],
    [checkins.length,  "#3b82f6","Check-ins"],
    [checkouts.length, "#f59e0b","Check-outs"],
    [cfAtiva ? 0 : cleaning.length, "#a855f7","Em Limpeza"],
    [cfAtiva ? 0 : ROOMS.length - occupied.length - cleaning.length, "#22c55e","Disponíveis"],
  ].forEach(([v,c,l])=>{
    html+=`<div class="kpi"><div class="val" style="color:${c}">${v}</div><div class="lbl">${l}</div></div>`;
  });
  html+=`</div>`;

  // Banner Casa Fechada
  if (cfAtiva) {
    html+=`<div style="background:#0f1e2b;border:1px solid #3b82f644;border-radius:10px;padding:12px 18px;
      margin-bottom:16px;display:flex;align-items:center;gap:12px">

      <div>
        <div style="font-size:13px;font-weight:700;color:#3b82f6">Casa Fechada</div>
        <div style="font-size:11px;color:var(--mu);margin-top:2px">
          ${esc(cfAtiva.guestName)} · ${fmtDate(cfAtiva.checkIn)} → ${fmtDate(cfAtiva.checkOut)}
        </div>
      </div>
      <span class="pill" style="background:#3b82f622;color:#3b82f6;margin-left:auto">CF</span>
    </div>`;
  }

  // Legend
  html+=`<div class="legend">`;
  Object.entries(STATUS).forEach(([k,v])=>{
    html+=`<div class="legend-item"><div class="legend-dot" style="background:${v.color};box-shadow:0 0 5px ${v.color}"></div>${v.label}</div>`;
  });
  html+=`</div>`;

  // Room grid — quartos 11 e 12 aparecem agrupados como suíte
  html+=`<div class="room-grid">`;
  ROOMS.forEach(room=>{
    // Quarto 11 → abre o bloco da suíte
    if (room.id==="11") {
      const st11 = cfAtiva ? "occupied" : getRoomStatus("11");
      const st12 = cfAtiva ? "occupied" : getRoomStatus("12");

    html+=`</div></div>`;
  }
  return html;
}

    ${todayCheckins===0?"· <b>Nenhum check-in hoje</b>":""}</div>` : ""}
  ${filterTab==="checkouts" ? `<div style="background:#2b1e0a;border:1px solid #f59e0b44;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:12px;color:#f59e0b">
    🧹 Check-outs de hoje — ${new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}
    ${todayCheckouts===0?"· <b>Nenhum check-out hoje</b>":""}</div>` : ""}
  `;

  if (!list.length) {
    html+=`<div style="text-align:center;color:var(--bd);padding:48px;font-size:15px">Nenhuma reserva encontrada</div>`;
    return html;
  }

  if (groupByDate) {
    const groups = {};
    list.forEach(r=>{
      const key = r.checkIn.slice(0,7);
      if (!groups[key]) groups[key]=[];
      groups[key].push(r);
    });
    Object.entries(groups).sort(([a],[b])=>a.localeCompare(b)).forEach(([key,rows])=>{
      const label = new Date(key+"-01T12:00:00").toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
      html+=`<div class="date-group-header">
        <div class="date-group-badge">${label.charAt(0).toUpperCase()+label.slice(1)} · ${rows.length} reserva${rows.length!==1?"s":""}</div>
        <div class="date-group-line"></div>
      </div>`;
      rows.forEach(r=>{ html+=resRow(r); });
    });
  } else {
    list.forEach(r=>{ html+=resRow(r); });
  }
  return html;
}

function isSuiteRes(r) {
  if (r.roomId!=="11" && r.roomId!=="12") return false;
  // 1) marcado explicitamente nas notas
  if (r.notes && (r.notes.includes("[Suíte grupo:") || r.notes.includes("Suíte 11+12"))) return true;
  return false;
}

// Deduplica reservas de Casa Fechada — mostra 1 linha com "CF"
function groupCasaFechada(list) {
  const seen = new Set();
  return list.reduce((acc, r) => {
    if (r.notes && r.notes.includes("[Casa toda:")) {
      // Sempre agrupa por hóspede+datas — garante deduplicação
      // independente de como a chave interna foi gerada por quarto
      const key = `cf-${r.guestName}-${r.checkIn}-${r.checkOut}`;
      if (seen.has(key)) return acc;
      seen.add(key);
      acc.push({ ...r, roomId: "CF", _isCFRow: true });
    } else {
      acc.push(r);
    }
    return acc;
  }, []);
}

// Retorna chave de agrupamento para um quarto 11 ou 12
function suiteKey(r) {
  // prioridade: ID de grupo explícito nas notas
  const m = (r.notes||"").match(/\[Suíte grupo:([^\]]+)\]/);
  if (m) return "grp-" + m[1];
  // fallback: mesmo hóspede + mesmas datas (cobre importações iCal)
  return `pair-${r.guestName}-${r.checkIn}-${r.checkOut}`;
}

// Agrupa reservas de suíte para exibir como uma linha só
function groupSuiteReservations(list) {
  const grouped = [];
  const seen = new Set();

  list.forEach(r=>{
    if (r.roomId!=="11" && r.roomId!=="12") {
      grouped.push(r); return;
    }
    // Se é Casa Fechada, não agrupa como suíte — já será deduplicado abaixo
    if (r.notes && r.notes.includes("[Casa toda:")) {
      grouped.push(r); return;
    }
    // Quarto 11 ou 12 — verifica se existe par no mesmo período
    const hasPair = list.some(o =>
      o.id !== r.id &&
      ((r.roomId==="11" && o.roomId==="12") || (r.roomId==="12" && o.roomId==="11")) &&
      o.checkIn === r.checkIn && o.checkOut === r.checkOut &&
      o.status === r.status
    );

    if (hasPair) {
      // Agrupa como suíte — mostra apenas uma linha
      const key = suiteKey(r) || `pair-${r.guestName}-${r.checkIn}-${r.checkOut}`;
      if (seen.has(key)) return;
      seen.add(key);
      grouped.push({ ...r, roomId:"11+12", _isSuiteRow:true });
    } else {
      // Quarto 11 ou 12 reservado individualmente — mostra normal
      grouped.push(r);
    }
  });
  return grouped;
}

function resRow(r) {
  const isCasaToda = r._isCFRow || (r.notes && r.notes.includes("[Casa toda:"));
  const isSuite  = !isCasaToda && (r._isSuiteRow || isSuiteRes(r));
  const roomLabel= isCasaToda ? "CF" : isSuite ? "11+12" : r.roomId;
  const room     = isCasaToda ? {type:"Casa Fechada — pousada toda"}
                 : isSuite    ? {type:"Suíte (Triplo ×2, Ventilador)"}
                 : ROOMS.find(rm=>rm.id===r.roomId);
  const n        = nights(r.checkIn, r.checkOut);
  const srcClr   = SRC_COLOR[r.source]||"var(--mu)";
  const cancelled= r.status==="cancelled";
  return `<div class="res-row" style="opacity:${cancelled?.45:1}" onclick="openEditModal('${r.id}')">
    <div class="res-id" style="${isCasaToda?"border:1px solid #3b82f655;color:#3b82f6;font-size:13px;background:#0f1e2b":isSuite?"border:1px solid #f59e0b55;color:#f59e0b;font-size:13px":""}">${roomLabel}</div>
    <div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px">
        ${esc(r.guestName)}
        ${isCasaToda?`<span class="pill" style="background:#3b82f622;color:#3b82f6">🏡 CF</span>`:""}
        ${isSuite?`<span class="pill" style="background:#f59e0b22;color:#f59e0b">🔗 suíte</span>`:""}
      </div>
      <div style="font-size:11px;color:var(--mu);margin-top:3px">
        ${room?.type||""} · ${fmtDate(r.checkIn)} → ${fmtDate(r.checkOut)}
        · <b style="color:var(--dm)">${n} noite${n!==1?"s":""}</b>
        ${r.phone?` · ${esc(r.phone)}`:""}    
      </div>
    </div>
    <div style="display:flex;gap:7px;align-items:center;flex-shrink:0">
      <span class="pill" style="background:${srcClr}28;color:${srcClr}">${r.source}</span>
      ${cancelled?`<span class="pill" style="background:#ef444428;color:#ef4444">cancelado</span>`:""}
      <span style="color:var(--bd);font-size:20px">›</span>
    </div>
  </div>`;
}

}

function renderFinChart(income, expense) {
  // Agrega por categoria
  const incByCat = {}, expByCat = {};
  income.forEach(t  => { incByCat[t.category] = (incByCat[t.category]||0)+Number(t.amount); });
  expense.forEach(t => { expByCat[t.category] = (expByCat[t.category]||0)+Number(t.amount); });

  const allInc = Object.entries(incByCat).sort((a,b)=>b[1]-a[1]);
  const allExp = Object.entries(expByCat).sort((a,b)=>b[1]-a[1]);
  const maxVal = Math.max(...allInc.map(x=>x[1]), ...allExp.map(x=>x[1]), 1);

  if (!allInc.length && !allExp.length) return "";

  const bar = (cat, val, color) => {
    const pct = Math.round((val/maxVal)*100);
    const info = FIN_CATEGORIES[cat] || {label:cat, icon:"•"};
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <div style="font-size:13px;width:20px;text-align:center">${info.icon}</div>
      <div style="font-size:11px;color:var(--mu);width:120px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${info.label}</div>
      <div style="flex:1;background:var(--bg0);border-radius:4px;height:16px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${color};border-radius:4px;transition:width .3s"></div>
      </div>
      <div style="font-size:11px;font-weight:600;color:var(--tx);width:90px;text-align:right;flex-shrink:0">${fmtMoney(val)}</div>
    </div>`;
  };

  return `<div style="background:var(--bg1);border:1px solid var(--bd);border-radius:12px;padding:16px">
    <div style="font-size:11px;color:var(--mu);font-weight:700;letter-spacing:.1em;margin-bottom:14px">DISTRIBUIÇÃO DO MÊS</div>
    ${allInc.length ? `<div style="font-size:10px;color:#22c55e;font-weight:700;letter-spacing:.08em;margin-bottom:8px">ENTRADAS</div>
      ${allInc.map(([k,v])=>bar(k,v,"#22c55e")).join("")}` : ""}
    ${allExp.length ? `<div style="font-size:10px;color:#ef4444;font-weight:700;letter-spacing:.08em;margin:12px 0 8px">SAÍDAS</div>
      ${allExp.map(([k,v])=>bar(k,v,"#ef4444")).join("")}` : ""}
  </div>`;
}

          <select id="ft-cat"></select></div>
      </div>
      <div class="field"><label>Descrição</label>
        <input id="ft-desc" value="${esc(t.description||"")}" placeholder="Ex: Conta de luz de março"></div>
      <div class="row2">
        <div class="field"><label>Valor (R$)</label>
          <input type="number" id="ft-amount" value="${esc(t.amount||"")}" min="0" step="0.01" placeholder="0,00"></div>
        <div class="field"><label>Data</label>
          <input type="date" id="ft-date" value="${esc(t.date||today)}"></div>
      </div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      ${isEdit?`<button class="btn btn-red" onclick="deleteTransaction('${t.id}')">Excluir</button>`:""}
      <button class="btn btn-green" onclick="saveTransaction(${isEdit?`'${t.id}'`:"null"})">
        ${isEdit?"Salvar":"Registrar"}
      </button>
    </div>`;
  document.getElementById("modal").style.display = "flex";

  // Preenche opções de categoria
  updateFinCatOptions(t.category);
}

function updateFinCatOptions(selectedCat) {
  const type = document.getElementById("ft-type")?.value;
  const sel  = document.getElementById("ft-cat");
  if (!sel) return;
  sel.innerHTML = Object.entries(FIN_CATEGORIES)
    .filter(([,v])=>v.type===type)
    .map(([k,v])=>`<option value="${k}" ${k===selectedCat?"selected":""}>${v.icon} ${v.label}</option>`)
    .join("");
}

async function saveTransaction(id) {
  const t = {
    id:          id || Math.random().toString(36).slice(2,10),
    type:        document.getElementById("ft-type")?.value,
    category:    document.getElementById("ft-cat")?.value,
    description: document.getElementById("ft-desc")?.value.trim(),
    amount:      parseFloat(document.getElementById("ft-amount")?.value)||0,
    date:        document.getElementById("ft-date")?.value,
  };
  if (!t.description) { alert("Preencha a descrição"); return; }
  if (!t.amount || t.amount <= 0) { alert("Valor deve ser maior que zero"); return; }
  if (!t.date) { alert("Selecione a data"); return; }
  t.month = t.date.slice(0,7);

  if (id) await api("PUT",  "/transactions/"+id, t);
  else    await api("POST", "/transactions", t);

  closeModal();
  await loadTransactions(finMonth);
}

async function deleteTransaction(id) {
  if (!confirm("Excluir este lançamento?")) return;
  await api("DELETE", "/transactions/"+id);
  closeModal();
  await loadTransactions(finMonth);
}


// ─── ALERTAS VIEW ─────────────────────────────────────────────────────────────
function renderAlertas() {
  // Detecta overbooking: mesma sala, datas sobrepostas, fontes diferentes
  const confirmed = reservations.filter(r => r.status !== "cancelled");
  const conflicts = [];

  for (let i = 0; i < confirmed.length; i++) {
    for (let j = i + 1; j < confirmed.length; j++) {
      const a = confirmed[i], b = confirmed[j];
      if (a.roomId !== b.roomId) continue;
      // Sobreposição: a começa antes de b terminar E b começa antes de a terminar
      if (a.checkIn >= b.checkOut || b.checkIn >= a.checkOut) continue;
      // Só alerta se fontes diferentes OU ambas confirmadas do mesmo source (duplicata)
      const key = [a.id, b.id].sort().join("|");
      if (!conflicts.find(c => c.key === key)) {
        conflicts.push({ key, a, b });
      }
    }
  }

  // Também detecta pré-reservas que conflitam com reservas confirmadas
  const preConflicts = [];
  for (const pre of prereservations) {
    if (!pre.check_in || !pre.check_out) continue;
    if (pre.status === "recusado") continue;
    const norm = { roomId: pre.room_id, checkIn: pre.check_in, checkOut: pre.check_out };
    const clash = confirmed.find(r =>
      r.roomId === norm.roomId &&
      r.checkIn < norm.checkOut &&
      r.checkOut > norm.checkIn
    );
    if (clash) preConflicts.push({ pre, clash });
  }

  const total = conflicts.length + preConflicts.length;

  let html = `<div style="margin-bottom:20px">`;

  if (total === 0) {
    html += `<div style="text-align:center;padding:60px 0">
      <div style="font-size:48px;margin-bottom:12px">✅</div>
      <div style="font-size:16px;font-weight:700;color:#22c55e">Nenhum conflito detectado</div>
      <div style="font-size:13px;color:var(--mu);margin-top:6px">
        Todas as reservas confirmadas estão sem sobreposição de datas.
      </div>
    </div>`;
  } else {
    html += `<div style="background:#2b0f0f;border:1px solid #ef444466;border-radius:12px;
      padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px">
      <span style="font-size:28px">⚠️</span>
      <div>
        <div style="font-weight:700;color:#ef4444;font-size:14px">${total} conflito${total!==1?"s":""} encontrado${total!==1?"s":""}</div>
        <div style="font-size:12px;color:var(--mu);margin-top:2px">Verifique e resolva antes de aceitar novas reservas</div>
      </div>
    </div>`;
  }

  // Conflitos entre reservas confirmadas
  if (conflicts.length > 0) {
    html += `<div style="font-size:11px;color:#ef4444;font-weight:700;letter-spacing:.1em;margin-bottom:12px">
      OVERBOOKING — RESERVAS CONFIRMADAS</div>`;

    conflicts.forEach(({ a, b }) => {
      const srcA = SRC_COLOR[a.source] || "var(--mu)";
      const srcB = SRC_COLOR[b.source] || "var(--mu)";
      const room = ROOMS.find(r => r.id === a.roomId);
      const overlapStart = a.checkIn > b.checkIn ? a.checkIn : b.checkIn;
      const overlapEnd   = a.checkOut < b.checkOut ? a.checkOut : b.checkOut;
      html += `<div style="background:var(--bg2);border:1.5px solid #ef444444;border-radius:12px;
        padding:16px 18px;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
          <div style="background:#2b0f0f;border:1px solid #ef4444;border-radius:8px;
            padding:6px 12px;font-weight:800;font-size:16px;color:#ef4444">${esc(a.roomId)}</div>
          <div>
            <div style="font-weight:700;font-size:13px;color:#ef4444">Overbooking no Quarto ${esc(a.roomId)}</div>
            <div style="font-size:11px;color:var(--mu);margin-top:2px">${room?.type||""} · Sobreposição: ${fmtDate(overlapStart)} → ${fmtDate(overlapEnd)}</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          ${[a,b].map((r,i) => `
          <div style="background:var(--bg0);border-radius:8px;padding:10px 12px;
            border-left:3px solid ${i===0?srcA:srcB}">
            <div style="font-size:10px;color:${i===0?srcA:srcB};font-weight:700;letter-spacing:.08em;margin-bottom:4px">${esc(r.source).toUpperCase()}</div>
            <div style="font-weight:700;font-size:13px">${esc(r.guestName)}</div>
            <div style="font-size:11px;color:var(--mu);margin-top:3px">${fmtDate(r.checkIn)} → ${fmtDate(r.checkOut)}</div>
            ${r.phone ? `<div style="font-size:11px;color:var(--dm);margin-top:2px">📞 ${esc(r.phone)}</div>` : ""}
            <button onclick="openEditModal('${esc(r.id)}')"
              style="margin-top:8px;font-size:10px;padding:4px 10px;border-radius:6px;
              border:1px solid var(--bd);background:var(--bg2);color:var(--tx);cursor:pointer;font-family:'DM Mono',monospace">
              Ver reserva →
            </button>
          </div>`).join("")}
        </div>
      </div>`;
    });
  }

  // Pré-reservas conflitando com confirmadas
  if (preConflicts.length > 0) {
    html += `<div style="font-size:11px;color:#f59e0b;font-weight:700;letter-spacing:.1em;
      margin:20px 0 12px">PRÉ-RESERVAS COM CONFLITO</div>`;
    preConflicts.forEach(({ pre, clash }) => {
      const srcClr = SRC_COLOR[clash.source] || "var(--mu)";
      html += `<div style="background:var(--bg2);border:1.5px solid #f59e0b44;border-radius:12px;
        padding:16px 18px;margin-bottom:12px">
        <div style="font-size:10px;color:#f59e0b;font-weight:700;margin-bottom:10px">
          ⚠️ PRÉ-RESERVA vs CONFIRMADA — Quarto ${esc(pre.room_id||"")}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div style="background:var(--bg0);border-radius:8px;padding:10px 12px;border-left:3px solid #f59e0b">
            <div style="font-size:10px;color:#f59e0b;font-weight:700;margin-bottom:4px">PRÉ-RESERVA</div>
            <div style="font-weight:700;font-size:13px">${esc(pre.guest_name||"")}</div>
            <div style="font-size:11px;color:var(--mu);margin-top:3px">${fmtDate(pre.check_in)} → ${fmtDate(pre.check_out)}</div>
            ${pre.phone ? `<div style="font-size:11px;color:var(--dm);margin-top:2px">📞 ${esc(pre.phone)}</div>` : ""}
            <button onclick="openPreReservaModal('${esc(pre.id)}')"
              style="margin-top:8px;font-size:10px;padding:4px 10px;border-radius:6px;
              border:1px solid #f59e0b44;background:var(--bg2);color:#f59e0b;cursor:pointer;font-family:'DM Mono',monospace">
              Editar →
            </button>
          </div>
          <div style="background:var(--bg0);border-radius:8px;padding:10px 12px;border-left:3px solid ${srcClr}">
            <div style="font-size:10px;color:${srcClr};font-weight:700;margin-bottom:4px">${esc(clash.source).toUpperCase()} — CONFIRMADA</div>
            <div style="font-weight:700;font-size:13px">${esc(clash.guestName)}</div>
            <div style="font-size:11px;color:var(--mu);margin-top:3px">${fmtDate(clash.checkIn)} → ${fmtDate(clash.checkOut)}</div>
            <button onclick="openEditModal('${esc(clash.id)}')"
              style="margin-top:8px;font-size:10px;padding:4px 10px;border-radius:6px;
              border:1px solid var(--bd);background:var(--bg2);color:var(--tx);cursor:pointer;font-family:'DM Mono',monospace">
              Ver reserva →
            </button>
          </div>
        </div>
      </div>`;
    });
  }

  html += `</div>
  <div style="font-size:11px;color:var(--mu);text-align:center;padding-top:8px">
    Atualizado em tempo real com as reservas do sistema. Sincronize o iCal para verificar cancelamentos.
  </div>`;
  return html;
}

// ─── PRÉ-RESERVAS VIEW ────────────────────────────────────────────────────────
const PRE_STATUS = {
  aguardando: { label:"Aguardando",  color:"#f59e0b", bg:"#2b1e0a" },
  confirmado: { label:"Confirmado",  color:"#22c55e", bg:"#0f2b1a" },
  recusado:   { label:"Recusado",    color:"#ef4444", bg:"#2b0f0f" },
};

function renderPreReservas() {
  const today = todayStr();
  const active   = prereservations.filter(p => p.status !== "recusado" && (!p.check_out || p.check_out >= today));
  const past     = prereservations.filter(p => p.status === "recusado"  || (p.check_out && p.check_out < today));

  let html = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px">
    <div style="font-size:13px;color:var(--mu)">
      Anote hóspedes interessados em datas específicas antes de confirmar a reserva.
    </div>
    <button class="btn btn-green" onclick="openPreReservaModal(null)">+ Nova Pré-reserva</button>
  </div>`;

  if (!prereservations.length) {
    html += `<div style="text-align:center;color:var(--mu);padding:48px 0;font-size:14px">
      Nenhuma pré-reserva cadastrada. Use para anotar leads e hóspedes interessados.
    </div>`;
    return html;
  }

  const renderGroup = (list, title, color) => {
    if (!list.length) return "";
    let s = `<div style="font-size:11px;color:${color};font-weight:700;letter-spacing:.1em;margin:20px 0 10px">${title}</div>`;
    list.forEach(p => {
      const st = PRE_STATUS[p.status] || PRE_STATUS.aguardando;
      const room = ROOMS.find(r => r.id === p.room_id);
      const n = p.check_in && p.check_out ? Math.max(0,Math.round((new Date(p.check_out)-new Date(p.check_in))/86400000)) : 0;
      // Checa conflito com reservas confirmadas
      const hasConflict = p.check_in && p.check_out && p.status !== "recusado" &&
        reservations.some(r =>
          r.roomId === p.room_id && r.status !== "cancelled" &&
          r.checkIn < p.check_out && r.checkOut > p.check_in
        );
      s += `<div style="background:var(--bg2);border:1.5px solid ${hasConflict?"#ef444466":st.color+"33"};
        border-radius:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer;
        display:flex;align-items:flex-start;gap:14px"
        onclick="openPreReservaModal('${esc(p.id)}')">
        <div style="width:46px;height:46px;border-radius:10px;background:${st.bg};
          border:1px solid ${st.color}44;display:flex;align-items:center;justify-content:center;
          font-size:16px;font-weight:800;color:${st.color};flex-shrink:0">
          ${esc(p.room_id||"?")}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px">
            ${esc(p.guest_name||"Sem nome")}
            ${hasConflict ? `<span class="pill" style="background:#ef444422;color:#ef4444">⚠️ conflito</span>` : ""}
          </div>
          <div style="font-size:11px;color:var(--mu);margin-top:3px">
            ${room ? room.type+" · " : ""}
            ${p.check_in ? fmtDate(p.check_in)+" → "+fmtDate(p.check_out) : "Datas não definidas"}
            ${n > 0 ? ` · <b style="color:var(--dm)">${n} noite${n!==1?"s":""}</b>` : ""}
            ${p.phone ? ` · 📞 ${esc(p.phone)}` : ""}
          </div>
          ${p.notes ? `<div style="font-size:11px;color:var(--dm);margin-top:5px;padding:6px 10px;
            background:var(--bg0);border-radius:6px;white-space:pre-wrap">${esc(p.notes)}</div>` : ""}
        </div>
        <div style="flex-shrink:0;text-align:right">
          <span class="pill" style="background:${st.bg};color:${st.color}">${st.label}</span>
        </div>
      </div>`;
    });
    return s;
  };

  html += renderGroup(active, "ATIVAS / AGUARDANDO", "#f59e0b");
  html += renderGroup(past,   "PASSADAS / RECUSADAS", "var(--mu)");
  return html;
}

function openPreReservaModal(id) {
  const p = id ? (prereservations.find(x => x.id === id) || {}) : {};
  const isEdit = !!id;
  const today  = todayStr();

  const roomOpts = [
    `<option value="">— Qualquer quarto —</option>`,
    ...ROOMS.map(r => `<option value="${r.id}" ${p.room_id===r.id?"selected":""}>${r.id} – ${r.type}</option>`)
  ].join("");

  const statusOpts = Object.entries(PRE_STATUS).map(([k,v]) =>
    `<option value="${k}" ${(p.status||"aguardando")===k?"selected":""}>${v.label}</option>`
  ).join("");

  document.getElementById("modal-title").innerHTML =
    `${isEdit?"📝 Editar":"📝 Nova"} Pré-reserva <button onclick="closeModal()">×</button>`;
  document.getElementById("modal-body").innerHTML = `
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
      <div class="row2">
        <div class="field"><label>Quarto de Interesse</label>
          <select id="pr-room">${roomOpts}</select></div>
        <div class="field"><label>Status</label>
          <select id="pr-status">${statusOpts}</select></div>
      </div>
      <div class="field"><label>Nome do Hóspede</label>
        <input id="pr-name" value="${esc(p.guest_name||"")}" placeholder="Nome ou apelido" autofocus></div>
      <div class="field"><label>Telefone / WhatsApp</label>
        <input id="pr-phone" value="${esc(p.phone||"")}" placeholder="(44) 99999-9999"></div>
      <div class="row2">
        <div class="field"><label>Check-in pretendido</label>
          <input type="date" id="pr-checkin" value="${esc(p.check_in||"")}"></div>
        <div class="field"><label>Check-out pretendido</label>
          <input type="date" id="pr-checkout" value="${esc(p.check_out||"")}"></div>
      </div>
      <div class="field"><label>Notas / Observações</label>
        <textarea id="pr-notes" style="height:90px">${esc(p.notes||"")}</textarea></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      ${isEdit?`<button class="btn btn-red" onclick="deletePreReserva('${esc(p.id)}')">Excluir</button>`:""}
      <button class="btn btn-green" onclick="savePreReserva(${isEdit?`'${esc(p.id)}'`:"null"})">
        ${isEdit?"Salvar Alterações":"Criar Pré-reserva"}
      </button>
    </div>`;
  document.getElementById("modal").style.display = "flex";
}

async function savePreReserva(id) {
  const get = i => document.getElementById(i)?.value || "";
  const body = {
    roomId:    get("pr-room"),
    guestName: get("pr-name").trim(),
    phone:     get("pr-phone").trim(),
    checkIn:   get("pr-checkin")  || null,
    checkOut:  get("pr-checkout") || null,
    notes:     get("pr-notes").trim(),
    status:    get("pr-status"),
  };
  if (!body.guestName) { alert("Informe ao menos o nome do hóspede."); return; }
  if (id) await api("PUT",  "/prereservations/"+id, body);
  else    await api("POST", "/prereservations", body);
  closeModal();
  await loadAll();
}

async function deletePreReserva(id) {
  if (!confirm("Excluir esta pré-reserva?")) return;
  await api("DELETE", "/prereservations/"+id);
  closeModal();
  await loadAll();
}

  });

  html+=`<div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
    <button class="btn btn-green" onclick="saveUrls()">💾 Salvar URLs</button>
    <button class="btn btn-blue" id="sync-btn" onclick="doSync()">🔄 Sincronizar Agora</button>
    <button class="btn btn-red" id="clean-btn" onclick="doCleanup()" title="Remove registros 'Not available', 'Closed', 'Blocked' etc do banco">🗑 Limpar Bloqueios</button>
  </div>`;

  if (syncLog.length) {
    html+=`<div class="log-box" id="log-box">${syncLog.map(l=>`<div>${l}</div>`).join("")}</div>`;
  }
  return html;
}

function setIcalUrl(src, roomId, val) {
  if (!icalUrls[src]) icalUrls[src]={};
  icalUrls[src][roomId]=val;
}

async function saveUrls() {
  await api("POST","/urls", icalUrls);
  alert("URLs salvas com sucesso!");
}

async function doCleanup() {
  const btn = document.getElementById("clean-btn");
  if (btn) btn.disabled = true;
  syncLog = ["🗑 Removendo bloqueios do banco..."];
  render();
  try {
    const data = await api("POST", "/cleanup-blocked");
    if (data.ok) {
      syncLog = [`✅ ${data.deleted} registro(s) de bloqueio removido(s) do banco.`];
    } else {
      syncLog = ["✗ Erro: " + (data.error||"desconhecido")];
    }
  } catch(e) {
    syncLog = ["✗ Erro: " + e.message];
  }
  if (btn) btn.disabled = false;
  render();
  await loadAll();
}

async function doSync() {
  const btn = document.getElementById("sync-btn");
  if (btn) btn.disabled=true;
  syncLog=["⏳ Sincronizando..."];
  render();
  try {
    const data = await api("POST","/sync");
    syncLog = data.log || ["✅ Concluído"];
  } catch(e) {
    syncLog=["✗ Erro: "+e.message];
  }
  if (btn) btn.disabled=false;
  render();
  await loadAll();
  const lb = document.getElementById("log-box");
  if (lb) lb.scrollTop=lb.scrollHeight;
}

async function submitCasaToda() {
  const get = i => document.getElementById(i)?.value||"";
  const guestName = get("ct-guestName").trim();
  const checkIn   = get("ct-checkIn");
  const checkOut  = get("ct-checkOut");
  const source    = get("ct-source");
  const adults    = +get("ct-adults")||18;
  const children  = +get("ct-children")||0;
  const phone     = get("ct-phone");
  const notes     = get("ct-notes");

  if (!guestName || !checkIn || !checkOut || checkOut <= checkIn) {
    alert("Preencha nome, check-in e check-out corretamente."); return;
  }

  const groupId = genId();
  const suiteGroupId = genId();

  // Desabilita botão
  const btn = document.querySelector(".modal .btn-green");
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Criando..."; }

  for (const room of ROOMS) {
    await saveReservation({
      id:        genId(),
      roomId:    room.id,
      guestName,
      checkIn, checkOut, source, phone,
      adults:   Math.round(adults / ROOMS.length),
      children: Math.round(children / ROOMS.length),
      notes:    notes + ` [Casa toda:${groupId}]`
        + (room.id==="11"||room.id==="12" ? ` [Suíte grupo:${suiteGroupId}]` : ""),
      status: "confirmed",
    });
  }

  closeModal();
}

async function submitForm(id) {
  const get = i => document.getElementById(i)?.value||"";
  const form = {
    id:        id||genId(),
    roomId:    get("f-roomId"),
    guestName: get("f-guestName").trim(),
    checkIn:   get("f-checkIn"),
    checkOut:  get("f-checkOut"),
    source:    get("f-source"),
    adults:    +get("f-adults")||2,
    children:  +get("f-children")||0,
    phone:     get("f-phone"),
    notes:     get("f-notes"),
    amount:    parseFloat(get("f-amount"))||0,
    payment:   get("f-payment")||"pix",
    status:    "confirmed",
  };
  if (!form.guestName||!form.checkIn||!form.checkOut||form.checkOut<=form.checkIn) {
    alert("Preencha nome, check-in e check-out corretamente."); return;
  }
  // Verifica sobreposição de datas para o quarto (apenas reservas manuais)
  if (form.roomId !== "CF" && form.roomId !== "11+12") {
    const conflict = reservations.find(r =>
      r.id !== form.id &&
      r.roomId === form.roomId &&
      r.status !== "cancelled" &&
      r.checkIn < form.checkOut &&
      r.checkOut > form.checkIn
    );
    if (conflict) {
      alert(`⚠️ Conflito de datas!\nQuarto ${form.roomId} já tem reserva de ${fmtDate(conflict.checkIn)} a ${fmtDate(conflict.checkOut)} (${conflict.guestName}).`);
      return;
    }
  }

  // Auto-save hóspede apenas para reservas diretas (não iCal)
  if (form.source === "direto") {
    await autoSaveGuest(form.guestName, get("f-phone"), get("f-email"));
  }

  // Cria transação financeira para reservas diretas (não booking/airbnb)
  if (form.amount > 0 && form.source === "direto" && !id) {
    await api("POST", "/transactions", {
      id:          genId(),
      type:        "income",
      category:    "reserva_direta",
      description: `Reserva Qto ${form.roomId === "CF" ? "Casa Fechada" : form.roomId === "11+12" ? "11+12" : form.roomId} — ${form.guestName}`,
      amount:      form.amount,
      date:        form.checkIn,
      month:       form.checkIn.slice(0,7),
      reservation_id: form.id,
    });
    if (finMonth === form.checkIn.slice(0,7)) await loadTransactions(finMonth);
  }

  // Casa Fechada → uma reserva por quarto, todas vinculadas com mesmo groupId
  if (form.roomId==="CF") {
    const cfGroupId = genId();
    for (const room of ROOMS) {
      await saveReservation({
        ...form,
        id:     genId(),
        roomId: room.id,
        notes:  (form.notes||"") + ` [Casa toda:${cfGroupId}]`,
      });
    }
    closeModal(); return;
  }

  // Suíte 11+12 → cria duas reservas vinculadas
  if (form.roomId==="11+12") {
    const suiteGroupId = genId();
    for (const rid of ["11","12"]) {
      await saveReservation({
        ...form,
        id:       genId(),
        roomId:   rid,
        notes:    (form.notes||"") + ` [Suíte grupo:${suiteGroupId}]`,
      });
    }
  } else {
    await saveReservation(form);
  }
  closeModal();
}

// ─── Auto-save hóspede ────────────────────────────────────────────────────────
const GENERIC_NAMES = /^(reserved|blocked|closed|not available|unavailable|bloqueado|airbnb|booking)/i;

// ─── Autocomplete hóspede ─────────────────────────────────────────────────────
function showGuestSuggestions(query) {
  const box = document.getElementById("guest-suggestions");
  if (!box) return;
  const q = query.trim().toLowerCase();
  if (q.length < 2) { box.style.display="none"; return; }
  const matches = guests.filter(g =>
    g.name.toLowerCase().includes(q) ||
    (g.phone||"").includes(q)
  ).slice(0, 6);
  if (!matches.length) { box.style.display="none"; return; }
  box.innerHTML = matches.map(g => `
    <div onmousedown="fillGuestFromSuggestion('${g.id}')"
      style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--bd);
      display:flex;align-items:center;gap:10px"
      onmouseover="this.style.background='var(--bg3)'"
      onmouseout="this.style.background=''">
      <span style="font-size:16px">👤</span>
      <div>
        <div style="font-size:13px;font-weight:600">${esc(g.name)}</div>
        <div style="font-size:10px;color:var(--mu)">${esc(g.phone||"")}${g.phone&&g.email?" · ":""}${esc(g.email||"")}</div>
      </div>
    </div>`).join("");
  box.style.display = "block";
}

function hideGuestSuggestions() {
  const box = document.getElementById("guest-suggestions");
  if (box) box.style.display = "none";
}

function fillGuestFromSuggestion(guestId) {
  const g = guests.find(x => x.id === guestId);
  if (!g) return;
  const nameEl  = document.getElementById("f-guestName");
  const phoneEl = document.getElementById("f-phone");
  const emailEl = document.getElementById("f-email");
  if (nameEl)  nameEl.value  = g.name;
  if (phoneEl) phoneEl.value = g.phone  || "";
  if (emailEl) emailEl.value = g.email  || "";
  hideGuestSuggestions();
}
async function autoSaveGuest(name, phone, email) {
  if (!name || GENERIC_NAMES.test(name.trim())) return;
  // Procura por nome exato ou telefone
  const existing = guests.find(g =>
    g.name === name || (phone && g.phone === phone)
  );
  if (existing) {
    // Atualiza phone/email se vieram preenchidos e estavam vazios
    const needsUpdate =
      (phone && !existing.phone) || (email && !existing.email);
    if (needsUpdate) {
      await api("PUT", "/guests/"+existing.id, {
        ...existing,
        phone: phone || existing.phone,
        email: email || existing.email,
      });
    }
  } else {
    // Cadastra novo hóspede
    await api("POST", "/guests", {
      id:    genId(),
      name, phone: phone||"", email: email||"",
      cpf:"", address:"", notes:"",
    });
  }
}

// ─── Init ─────────────────────────────────────────────────────────────────────
// Se já tem token salvo, tenta carregar direto; senão mostra login
let autoRefreshInterval = null;

function startAutoRefresh() {
  if (autoRefreshInterval) clearInterval(autoRefreshInterval);
  autoRefreshInterval = setInterval(loadAll, 5 * 60 * 1000);
}

function stopAutoRefresh() {
  if (autoRefreshInterval) { clearInterval(autoRefreshInterval); autoRefreshInterval = null; }
}
if (authToken) {
  applyRole();
  loadAll().catch(() => { clearAuth(); showLoginScreen(); });
  startAutoRefresh();
} else {
  showLoginScreen();
}
